<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轨道游戏 - Three.js</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
        }
        canvas {
            display: block;
        }
        #speed-display {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-shadow: 0 0 10px #00ffff;
        }
        #distance-display {
            position: absolute;
            top: 50px;
            left: 20px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-shadow: 0 0 10px #00ff88;
        }
        #score-display {
            position: absolute;
            top: 80px;
            left: 20px;
            color: #ffd700;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-shadow: 0 0 10px #ffd700;
        }
        #health-display {
            position: absolute;
            top: 110px;
            left: 20px;
            color: #ff4444;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            text-shadow: 0 0 10px #ff4444;
        }
        #track-display {
            position: absolute;
            top: 140px;
            left: 20px;
            color: #ffff00;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            text-shadow: 0 0 10px #ffff00;
        }
        #jump-hint {
            position: absolute;
            top: 110px;
            left: 20px;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            opacity: 0.6;
        }
        #jump-button {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #00aaff, #0066cc);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.5);
            user-select: none;
            touch-action: manipulation;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        #jump-button .arrow {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 18px solid rgba(255, 255, 255, 0.7);
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
        }
        #jump-button .text {
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        #jump-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 170, 255, 0.5);
        }
        
        /* ========== 气流跑道垂直移动按钮 ========== */
        #airway-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        
        #airway-up-button, #airway-down-button {
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #ff6600, #cc5500);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.5);
            user-select: none;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        #airway-up-button .arrow-up {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 18px solid rgba(255, 255, 255, 0.7);
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
        }
        
        #airway-down-button .arrow-down {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 18px solid rgba(255, 255, 255, 0.7);
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
        }
        
        #airway-up-button .text, #airway-down-button .text {
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        #airway-up-button:active, #airway-down-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 102, 0, 0.5);
        }
        
        /* ========== 射击按钮 ========== */
        #shoot-button {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #ff0066, #cc0055);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 102, 0.5);
            user-select: none;
            touch-action: manipulation;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            z-index: 100;
        }
        
        #shoot-button .crosshair {
            width: 24px;
            height: 24px;
            position: relative;
        }
        
        #shoot-button .crosshair::before,
        #shoot-button .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        
        #shoot-button .crosshair::before {
            width: 100%;
            height: 3px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        #shoot-button .crosshair::after {
            width: 3px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #shoot-button .text {
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        #shoot-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 0, 102, 0.5);
        }
        
        /* ========== 金币飞行动画 ========== */
        #coin-animation-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
        }
        
        .flying-coin {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #ffd700 100%);
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, inset 0 0 5px rgba(255, 255, 255, 0.5);
            font-size: 12px;
            color: #8B4513;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            animation: flyToScore 0.8s ease-out forwards;
        }
        
        @keyframes flyToScore {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: scale(0.5);
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            #speed-display, #distance-display, #score-display, #health-display, #track-display {
                font-size: 14px;
                left: 10px;
            }
            #speed-display {
                top: 10px;
            }
            #distance-display {
                top: 35px;
            }
            #score-display {
                top: 60px;
            }
            #health-display {
                top: 85px;
                font-size: 16px;
            }
            #track-display {
                top: 110px;
            }
            #jump-hint {
                display: none;
            }
            #jump-button {
                width: 80px;
                height: 80px;
                bottom: 25px;
                right: 25px;
            }
            #jump-button .arrow {
                width: 0;
                height: 0;
                border-left: 12px solid transparent;
                border-right: 12px solid transparent;
                border-bottom: 16px solid rgba(255, 255, 255, 0.7);
            }
            #jump-button .text {
                font-size: 12px;
            }
        }
        @media (max-width: 480px) {
            #jump-button {
                width: 70px;
                height: 70px;
                bottom: 20px;
                right: 20px;
            }
            #jump-button .arrow {
                border-left: 10px solid transparent;
                border-right: 10px solid transparent;
                border-bottom: 14px solid rgba(255, 255, 255, 0.7);
            }
            #jump-button .text {
                font-size: 11px;
            }
        }
        @media (min-width: 769px) {
            #jump-button:hover {
                transform: scale(1.05);
                box-shadow: 0 6px 20px rgba(0, 170, 255, 0.6);
            }
        }

        /* ========== 暂停按钮 ========== */
        #pause-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #ffaa00, #cc6600);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.5);
            user-select: none;
            touch-action: manipulation;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        #pause-button.show {
            display: flex;
        }

        #pause-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 170, 0, 0.5);
        }

        #pause-button .pause-icon {
            display: flex;
            gap: 3px;
        }

        #pause-button .pause-icon span {
            width: 4px;
            height: 16px;
            background: white;
            border-radius: 2px;
        }

        #pause-hint {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: #ffff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            opacity: 0.7;
            text-shadow: 0 0 10px #ffff00;
            z-index: 100;
            display: none;
        }

        #pause-hint.show {
            display: block;
        }

        /* ========== 加载界面 ========== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-title {
            font-family: 'Courier New', monospace;
            font-size: 48px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            margin-bottom: 50px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #progress-container {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #00ff88);
            border-radius: 4px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00ffff;
        }

        #progress-text {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #ffffff;
            opacity: 0.7;
        }

        /* ========== 主菜单界面 ========== */
        #main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 900;
        }

        #main-menu.show {
            display: flex;
        }

        #game-title {
            font-family: 'Courier New', monospace;
            font-size: 64px;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff;
            margin-bottom: 20px;
        }

        #game-subtitle {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #00ff88;
            margin-bottom: 60px;
            opacity: 0.8;
        }

        /* 菜单按钮基础样式 */
        .menu-button {
            width: 200px;
            height: 60px;
            background: linear-gradient(145deg, #00aaff, #0066cc);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 170, 255, 0.5);
            margin: 10px;
            transition: all 0.3s ease;
        }

        .menu-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 170, 255, 0.7);
        }

        .menu-button:active {
            transform: scale(0.95);
        }

        #controls-info {
            margin-top: 40px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #ffffff;
            opacity: 0.6;
            text-align: center;
            line-height: 2;
        }

        /* ========== 暂停界面 ========== */
        #pause-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 800;
        }

        #pause-screen.show {
            display: flex;
        }

        #pause-title {
            font-family: 'Courier New', monospace;
            font-size: 56px;
            color: #ffff00;
            text-shadow: 0 0 20px #ffff00;
            margin-bottom: 50px;
        }

        /* ========== 结束界面 ========== */
        #gameover-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 800;
        }

        #gameover-screen.show {
            display: flex;
        }

        #gameover-title {
            font-family: 'Courier New', monospace;
            font-size: 64px;
            color: #ff4444;
            text-shadow: 0 0 30px #ff4444;
            margin-bottom: 30px;
        }

        #gameover-score, #gameover-distance, #gameover-coins {
            font-family: 'Courier New', monospace;
            font-size: 28px;
            color: #ffffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 15px;
        }

        #gameover-score {
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700;
        }

        /* ========== 倒计时界面 ========== */
        #countdown-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 850;
        }

        #countdown-screen.show {
            display: flex;
        }

        #countdown-number {
            font-family: 'Courier New', monospace;
            font-size: 120px;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff;
            animation: countdownPulse 1s ease-in-out;
        }

        @keyframes countdownPulse {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- 加载界面 -->
    <div id="loading-screen">
        <div id="loading-title">轨道跑酷</div>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="progress-text">加载中...</div>
    </div>

    <!-- 主菜单界面 -->
    <div id="main-menu">
        <div id="game-title">轨道跑酷</div>
        <div id="game-subtitle">极限挑战 · 无限可能</div>
        <button id="start-button" class="menu-button">开始游戏</button>
        <!-- 联机大厅指向本地服务 localhost:5621，公网部署不可用，故隐藏 -->
        <button id="multiplayer-button" class="menu-button" style="display:none">联机大厅</button>
        <button id="gallery-button" class="menu-button">障碍物图鉴</button>
        <button id="fullscreen-button" class="menu-button">全屏模式</button>
        <div id="controls-info">
            <div>按 A/D 或 ←/→ 切换轨道</div>
            <div>按 空格 或 点击按钮 跳跃</div>
            <div>按 P 键暂停游戏</div>
            <div>按 F 键全屏</div>
        </div>
    </div>

    <!-- 暂停界面 -->
    <div id="pause-screen">
        <div id="pause-title">游戏暂停</div>
        <button id="resume-button" class="menu-button">继续游戏</button>
        <button id="quit-button" class="menu-button">返回主菜单</button>
    </div>

    <!-- 结束界面 -->
    <div id="gameover-screen">
        <div id="gameover-title">游戏结束</div>
        <div id="gameover-score">积分: 0</div>
        <div id="gameover-distance">距离: 0米</div>
        <div id="gameover-coins">金币: 0</div>
        <button id="restart-button" class="menu-button">重新开始</button>
        <button id="menu-button" class="menu-button">返回主菜单</button>
    </div>

    <!-- 倒计时界面 -->
    <div id="countdown-screen">
        <div id="countdown-number">3</div>
    </div>

    <!-- 游戏界面 -->
    <div id="speed-display">速度: 1格/秒</div>
    <div id="distance-display">距离: 0米</div>
    <div id="score-display">积分: 0</div>
    <div id="health-display">生命: ❤️❤️❤️❤️❤️</div>
    <div id="track-display">当前轨道: 中</div>
    <div id="jump-hint">按 空格键 或点击按钮 跳跃</div>
    <button id="jump-button">
        <span class="arrow"></span>
        <span class="text">跳跃</span>
    </button>
    
    <!-- 气流跑道垂直移动按钮 -->
    <div id="airway-controls" style="display: none;">
        <button id="airway-up-button">
            <span class="arrow-up"></span>
            <span class="text">上升</span>
        </button>
        <button id="airway-down-button">
            <span class="arrow-down"></span>
            <span class="text">下降</span>
        </button>
    </div>
    
    <!-- 射击按钮 -->
    <button id="shoot-button">
        <span class="crosshair"></span>
        <span class="text">射击</span>
    </button>
    
    <!-- 金币飞行动画容器 -->
    <div id="coin-animation-container"></div>
    
    <button id="pause-button">
        <div class="pause-icon">
            <span></span>
            <span></span>
        </div>
    </button>
    <div id="pause-hint">按 P 暂停</div>
    <canvas id="canvas"></canvas>
    <script>
        // ========== 游戏设置总览（所有可调整参数）==========
        const GAME_CONFIG = {
            // ========== 玩家设置 ==========
            player: {
                sphereRadius: 0.5,           // 玩家球体半径
                trackWidth: 1.8,             // 轨道宽度
                trackGap: 0.15,              // 轨道间距
                groundY: 0.5,                // 地面Y位置（等于sphereRadius）
                jumpForce: 8,                // 跳跃力度
                gravity: 25,                 // 重力加速度
                maxFallSpeed: 8,             // 最大下落速度
                maxBaseSpeed: 48,            // 最大基础速度
                speedGrowthRate: 0.5,        // 速度增长速率（每秒）
                speedRecoveryRate: 10,       // 速度恢复速率（每秒）
                trackSwitchSpeed: 10,        // 地面轨道切换速度（线性插值系数）
                airwayVerticalSpeed: 2.5,    // 气流跑道垂直移动速度（格/秒）
                airwaySwitchSpeed: 8,        // 气流跑道横向切换速度
                jumpHeight: 1.5,             // 跳跃目标高度
                jumpVelocityMultiplier: 6,   // 跳跃速度乘数
                baseSpeed: 20,               // 初始基础速度（等于segmentLength）
                boostAmount: 5,              // 加速增加的速度
                boostDuration: 5,            // 加速持续时间（秒）
                invulnerableDuration: 1.5,   // 开局无敌时间（秒）
                collisionSpeedPenalty: 0.6,  // 碰撞后速度保留比例（0.6=保留40%）
                collisionDamage: 1           // 碰撞伤害（生命值）
            },
            
            // ========== 子弹系统 ==========
            bullet: {
                speed: 65,                   // 子弹速度（格/秒）
                radius: 0.15,                // 子弹半径
                shootCooldown: 0.21,         // 射击冷却时间（秒）
                range: 150,                  // 子弹射击范围（格）
                color: 0xffff00,             // 子弹颜色（黄色）
                emissiveIntensity: 2         // 发光强度
            },
            
            // ========== 浮空障碍物墙（气流跑道）==========
            airwayWall: {
                interval: 180,               // 生成间隔（格）
                width: 10,                   // 总宽度（格）
                height: 4.5,                 // 总高度（格）
                depth: 1,                    // 厚度（格）
                blockWidth: 2,               // 单个小障碍物宽度（格）
                blockHeight: 1.5,            // 单个小障碍物高度（格）
                coinReward: 10,              // 每击毁一个小障碍物奖励金币
                invulnerableTime: 0.5,       // 碰撞后无敌时间（秒）
                color: 0xff4444,            // 障碍物颜色
                emissiveColor: 0xff2222,     // 发光颜色

        function createTrackSegment() {
            const group = new THREE.Group();
            group.userData.blocks = []; // 存储所有区块，用于大坑系统

            const numBlocks = Math.floor(segmentLength / BLOCK_LENGTH); // 每段轨道的区块数量

            for (let i = 0; i < 3; i++) {
                const xOffset = (i - 1) * (trackWidth + trackGap);
                
                // 为每个轨道创建多个区块
                for (let j = 0; j < numBlocks; j++) {
                    const trackGeometry = new THREE.BoxGeometry(trackWidth, 0.2, BLOCK_LENGTH);
                    const track = new THREE.Mesh(trackGeometry, trackMaterial);
                    const zOffset = (j - numBlocks / 2 + 0.5) * BLOCK_LENGTH;
                    track.position.set(xOffset, -0.1, zOffset);
                    track.userData.trackIndex = i;
                    track.userData.blockIndex = j;
                    track.userData.isBlock = true;
                    group.add(track);
                    group.userData.blocks.push(track);

                    // 为每个区块添加边缘
                    const leftEdge = new THREE.Mesh(
                        new THREE.BoxGeometry(0.05, 0.25, BLOCK_LENGTH),
                        edgeMaterial
                    );
                    leftEdge.position.set(xOffset - trackWidth / 2, 0.025, zOffset);
                    group.add(leftEdge);

                    const rightEdge = new THREE.Mesh(
                        new THREE.BoxGeometry(0.05, 0.25, BLOCK_LENGTH),
                        edgeMaterial
                    );
                    rightEdge.position.set(xOffset + trackWidth / 2, 0.025, zOffset);
                    group.add(rightEdge);
                }
            }

            const divider1 = new THREE.Mesh(
                new THREE.BoxGeometry(0.08, 0.05, segmentLength),
                dividerMaterial
            );
            divider1.position.set(-trackWidth / 2 - trackGap / 2, 0.01, 0);
            group.add(divider1);

            const divider2 = new THREE.Mesh(
                new THREE.BoxGeometry(0.08, 0.05, segmentLength),
                dividerMaterial
            );
            divider2.position.set(trackWidth / 2 + trackGap / 2, 0.01, 0);
            group.add(divider2);

            const wallHeight = 0.2;

            const leftWall = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, wallHeight, segmentLength),
                wallMaterial
            );
            leftWall.position.set(-totalTrackWidth / 2 - 0.1, wallHeight / 2, 0);
            group.add(leftWall);

            const rightWall = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, wallHeight, segmentLength),
                wallMaterial
            );
            rightWall.position.set(totalTrackWidth / 2 + 0.1, wallHeight / 2, 0);
            group.add(rightWall);

            return group;
        }

        // 在轨道段上生成大坑
        function generatePit(segment) {
            if (!segment.userData.blocks || segment.userData.blocks.length === 0) {
                return;
            }

            // 随机选择要删除的轨道（1条为主，2条概率很低）
            const tracksToRemove = [];
            const rand = Math.random();
            let numTracks;
            if (rand < 0.85) {
                numTracks = 1; // 85%概率：1条轨道
            } else {
                numTracks = 2; // 15%概率：2条轨道
            }

            while (tracksToRemove.length < numTracks) {
                const trackIndex = Math.floor(Math.random() * 3);
                if (!tracksToRemove.includes(trackIndex)) {
                    tracksToRemove.push(trackIndex);
                }
            }

            // 删除选定轨道上的一个区块（随机选择中间位置的区块）
            const blocks = segment.userData.blocks;

            for (const trackIndex of tracksToRemove) {
                const trackBlocks = blocks.filter(b => b.userData.trackIndex === trackIndex);

                if (trackBlocks.length >= 1) {
                    // 随机选择一个中间位置的区块删除
                    const middleIndex = Math.floor(trackBlocks.length / 2);
                    const blockToRemove = trackBlocks[middleIndex];

                    // 记录大坑位置信息，用于放置警示标识（使用局部坐标）
                    const pitZ = blockToRemove.userData.startZ;
                    const pitX = (trackIndex - 1) * (trackWidth + trackGap);

                    segment.remove(blockToRemove);
                    blockToRemove.geometry.dispose();

                    // 更新区块数组
                    segment.userData.blocks = blocks.filter(b => b !== blockToRemove);

                    // 在大坑前方添加警示标识
                    const warningGroup = new THREE.Group();
                    warningGroup.userData.type = 'warning';

                    // 警示条纹（交替红黄条纹）
                    const stripeWidth = trackWidth * 0.8;
                    const stripeLength = 0.3;

                    for (let i = 0; i < 3; i++) {
                        const mat = i % 2 === 0 ? warningMaterial : stripeMaterial;
                        const stripe = new THREE.Mesh(
                            new THREE.BoxGeometry(stripeWidth, 0.02, stripeLength),
                            mat
                        );
                        stripe.position.set(0, 0.01, i * 0.4);
                        warningGroup.add(stripe);
                    }

                    // 警示箭头（指向大坑方向）
                    const arrowShape = new THREE.Shape();
                    arrowShape.moveTo(0, 0.3);
                    arrowShape.lineTo(0.2, 0);
                    arrowShape.lineTo(0.1, 0);
                    arrowShape.lineTo(0.1, -0.3);
                    arrowShape.lineTo(-0.1, -0.3);
                    arrowShape.lineTo(-0.1, 0);

                    const arrowGeometry = new THREE.ShapeGeometry(arrowShape);

                    );
                    arrow.rotation.x = -Math.PI / 2;
                    arrow.position.set(0, 0.02, -0.6);
                    warningGroup.add(arrow);

                    warningGroup.position.set(pitX, 0, pitZ + BLOCK_LENGTH * 1.5);
                    segment.add(warningGroup);
                }
            }

        // ========== 气流系统 ==========

        // 创建气流跑道段
        function createAirwaySegment() {
            const group = new THREE.Group();
            group.userData.type = 'airway_segment';
            
            // 创建跑道边界线
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00ffff, 
                transparent: true, 
                opacity: 0.6 
            });
            
            // 左右边界线
            const leftLineGeom = new THREE.BufferGeometry().setFromPoints([

                new THREE.Vector3(-AIRWAY_WIDTH / 2, 0, AIRWAY_SEGMENT_LENGTH / 2)
            ]);
            const rightLineGeom = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(AIRWAY_WIDTH / 2, 0, -AIRWAY_SEGMENT_LENGTH / 2),
                new THREE.Vector3(AIRWAY_WIDTH / 2, 0, AIRWAY_SEGMENT_LENGTH / 2)
            ]);
            
            const leftLine = new THREE.Line(leftLineGeom, lineMaterial);
            const rightLine = new THREE.Line(rightLineGeom, lineMaterial);
            group.add(leftLine);
            group.add(rightLine);
            
            // 创建粒子效果
            const particleCount = GAME_CONFIG.airway.particleCount;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];
            const baseHeights = []; // 存储每个粒子的基础高度
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * AIRWAY_WIDTH;
                // 粒子分散在跑道上下2格范围内
                const baseHeight = (Math.random() - 0.5) * 4; // -2 到 +2
                baseHeights.push(baseHeight);
                positions[i * 3 + 1] = baseHeight;
                positions[i * 3 + 2] = (Math.random() - 0.5) * AIRWAY_SEGMENT_LENGTH;
                
                velocities.push({
                    speed: 3 + Math.random() * 2, // 向前运动速度
                    phase: Math.random() * Math.PI * 2,
                    floatSpeed: 1 + Math.random() * 1.5, // 浮动速度
                    floatAmplitude: 1 + Math.random() * 1.5 // 浮动幅度
                });
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0x00ffff,
                size: 0.3,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(geometry, material);
            particles.frustumCulled = false;
            group.add(particles);
            group.userData.particles = particles;
            group.userData.velocities = velocities;
            group.userData.baseHeights = baseHeights;
            group.userData.time = 0;
            
            return group;
        }
        
        // 初始化气流跑道
        function initAirways() {
            // 清空气流跑道
            for (const trackSegments of airways) {
                for (const segment of trackSegments) {
                    scene.remove(segment);
                    segment.userData.particles.geometry.dispose();
                    segment.userData.particles.material.dispose();
                }
            }
            airways.length = 0;
            
            // 创建三条平行的气流跑道
            for (let track = 0; track < AIRWAY_COUNT; track++) {
                const trackSegments = [];
                const airwayX = airwayTrackPositions[track]; // 使用气流跑道独立坐标
                
                for (let i = 0; i < AIRWAY_VISIBLE_SEGMENTS; i++) {
                    const segment = createAirwaySegment();
                    segment.position.x = airwayX;
                    segment.position.y = AIRWAY_HEIGHT;
                    segment.position.z = -i * AIRWAY_SEGMENT_LENGTH - AIRWAY_SEGMENT_LENGTH;
                    scene.add(segment);
                    trackSegments.push(segment);
                }
                
                airways.push(trackSegments);
            }
        }
        
        // 更新气流跑道
        function updateAirways(deltaTime, moveDist) {
            // 更新所有跑道的所有段
            for (const trackSegments of airways) {
                for (const segment of trackSegments) {
                    segment.position.z += moveDist;
                    
                    // 更新粒子动画（相对于玩家向前运动）
                    segment.userData.time += deltaTime;
                    const positions = segment.userData.particles.geometry.attributes.position.array;
                    const velocities = segment.userData.velocities;
                    const particleCount = positions.length / 3;
                    
                    for (let i = 0; i < particleCount; i++) {
                        const i3 = i * 3;
                        
                        // 获取该粒子的基础高度和浮动参数
                        const baseHeight = segment.userData.baseHeights[i];
                        const velocity = velocities[i];
                        
                        // 多层正弦波叠加，产生自然的起伏效果
                        const floatOffset1 = Math.sin(segment.userData.time * velocity.floatSpeed + velocity.phase) * velocity.floatAmplitude;
                        const floatOffset2 = Math.sin(segment.userData.time * velocity.floatSpeed * 2 + velocity.phase * 1.5) * (velocity.floatAmplitude * 0.5);
                        const floatOffset3 = Math.sin(segment.userData.time * velocity.floatSpeed * 0.5 + velocity.phase * 0.5) * (velocity.floatAmplitude * 0.3);
                        
                        // 总高度 = 基础高度 + 多层浮动
                        positions[i3 + 1] = baseHeight + floatOffset1 + floatOffset2 + floatOffset3;
                        
                        // 限制高度范围在跑道上下2格内
                        if (positions[i3 + 1] > 2) positions[i3 + 1] = 2;
                        if (positions[i3 + 1] < -2) positions[i3 + 1] = -2;
                        
                        // 粒子相对于玩家向后运动（产生气流感），比玩家快10格/秒
                        const relativeSpeed = gameState.currentSpeed + 10;
                        positions[i3 + 2] -= relativeSpeed * deltaTime;
                        
                        // 当粒子到达段的后端时，循环回到前端
                        if (positions[i3 + 2] < -AIRWAY_SEGMENT_LENGTH / 2) {
                            positions[i3 + 2] = AIRWAY_SEGMENT_LENGTH / 2;
                        }
                    }
                    segment.userData.particles.geometry.attributes.position.needsUpdate = true;
                }
                
                // 回收超出范围的跑道段（每条跑道独立回收）
                const recycleThreshold = AIRWAY_SEGMENT_LENGTH;
                const firstSegment = trackSegments[0];
                
                if (firstSegment.position.z > recycleThreshold) {
                    const recycledSegment = trackSegments.shift();
                    const lastSegment = trackSegments[trackSegments.length - 1];
                    
                    // 将回收的段放到最后
                    recycledSegment.position.z = lastSegment.position.z - AIRWAY_SEGMENT_LENGTH;
                    trackSegments.push(recycledSegment);
                }
            }
        }
        
        // 检测玩家是否在气流跑道上
        function checkAirwayInteraction() {
            // 如果正在下降，跳过检测，避免重新被捕获回气流跑道
            if (gameState.isDescending) {
                return { onAirway: false };
            }
            
            const playerY = playerSphere.position.y;
            const playerX = playerSphere.position.x;
            const playerZ = playerSphere.position.z;
            
            // 检查玩家是否在气流跑道高度范围内
            if (playerY >= AIRWAY_HEIGHT - AIRWAY_Y_MARGIN && 
                playerY <= AIRWAY_HEIGHT + AIRWAY_Y_MARGIN + 2) {
                
                // 遍历所有跑道
                for (let trackIndex = 0; trackIndex < AIRWAY_COUNT; trackIndex++) {
                    const trackSegments = airways[trackIndex];
                    if (!trackSegments) continue;
                    
                    const airwayX = airwayTrackPositions[trackIndex]; // 使用气流跑道坐标
                    
                    // 遍历该跑道的所有段
                    for (const segment of trackSegments) {
                        const airwayZ = segment.position.z;
                        
                        // 检查X和Z范围
                        const dx = Math.abs(playerX - airwayX);
                        const dz = Math.abs(playerZ - airwayZ);
                        
                        if (dx < AIRWAY_WIDTH / 2 + sphereRadius && dz < AIRWAY_SEGMENT_LENGTH / 2 + 2) {
                            return { 
                                onAirway: true, 
                                trackIndex: trackIndex, 
                                x: airwayX
                            };
                        }
                    }
                }
            }
            
            return { onAirway: false };
        }
        
        // 根据玩家速度动态计算气流偏移量
        function getDynamicAirflowOffset() {
            // 基础偏移量 + 速度相关增量
            // 速度越快，需要更早看到气流
            const speedFactor = Math.max(0, gameState.currentSpeed - gameState.baseSpeed);
            const offsetIncrement = speedFactor * 3; // 每超过基础速度1格/秒，增加1.5单位偏移
            return AIRFLOW_OFFSET_BASE + offsetIncrement;
        }
        
        // 查找最近的紫色障碍物
        function findNearestTallObstacle(z) {
            let nearest = null;
            let minDistance = Infinity;
            
            for (const obstacle of obstacles) {
                if (obstacle.userData.type === 'tall') {
                    const distance = obstacle.position.z - z;
                    if (distance > 0 && distance < minDistance) {
                        minDistance = distance;
                        nearest = obstacle;
                    }
                }
            }
            
            return nearest;
        }
        
        // 在紫色障碍物前面生成气流
        function generateAirflowNearTallObstacle() {
            // 查找最近的紫色障碍物
            const nearestTall = findNearestTallObstacle(-150);
            
            if (nearestTall) {
                // 在紫色障碍物前面生成气流（使用动态偏移量）
                const airflowX = nearestTall.position.x;
                const dynamicOffset = getDynamicAirflowOffset();
                const airflowZ = nearestTall.position.z + BLOCK_LENGTH / 2 + dynamicOffset;
                
                // 检查该位置是否已有气流
                const exists = airflows.some(a => 
                    Math.abs(a.position.z - airflowZ) < 5 && 
                    a.position.x === airflowX
                );
                
                if (!exists) {
                    const airflow = createAirflow(airflowX, airflowZ);
                    return airflow;
                }
            }
            
            return null;
        }
        
        // 创建气流（粒子特效）
        function createAirflow(x, z) {
            const group = new THREE.Group();
            group.userData.type = 'airflow';
            group.userData.startZ = z;
            group.userData.length = AIRFLOW_LENGTH;
            group.userData.height = AIRFLOW_HEIGHT;
            
            // 设置气流组的世界位置
            group.position.set(x, 0, z);
            
            // 创建气流粒子（使用局部坐标）
            const particleCount = AIRFLOW_PARTICLES;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];
            
            for (let i = 0; i < particleCount; i++) {
                // 粒子在气流区域内随机分布（使用局部坐标）
                positions[i * 3] = (Math.random() - 0.5) * 1.2; // X方向小范围（相对于气流中心）
                positions[i * 3 + 1] = Math.random() * AIRFLOW_HEIGHT; // Y方向从0到气流高度
                positions[i * 3 + 2] = (Math.random() - 0.5) * AIRFLOW_LENGTH; // Z方向在气流长度内（局部坐标）
                
                // 粒子向上运动的速度
                velocities.push({
                    x: (Math.random() - 0.5) * 0.5,
                    y: 2 + Math.random() * 2, // 向上速度
                    z: (Math.random() - 0.5) * 0.5
                });
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // 水蓝色材质
            const material = new THREE.PointsMaterial({
                color: 0x00ffff,
                size: 0.3,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(geometry, material);
            particles.frustumCulled = false;
            group.add(particles);
            group.userData.particles = particles;
            group.userData.velocities = velocities;
            group.userData.time = 0;
            
            return group;
        }
        
        // 更新气流粒子特效
        function updateAirflowParticles(group, deltaTime) {
            group.userData.time += deltaTime;
            
            const positions = group.userData.particles.geometry.attributes.position.array;
            const velocities = group.userData.velocities;
            const particleCount = positions.length / 3;
            const length = group.userData.length;
            const height = group.userData.height;
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                
                // 更新位置
                positions[i3] += velocities[i].x * deltaTime;
                positions[i3 + 1] += velocities[i].y * deltaTime;
                positions[i3 + 2] += velocities[i].z * deltaTime;
                
                // 如果粒子超出范围，重置到底部（使用局部坐标）
                if (positions[i3 + 1] > height || positions[i3 + 1] < 0) {
                    // 重置到随机底部位置（局部坐标，相对于气流组中心）
                    positions[i3] = (Math.random() - 0.5) * 1.2;
                    positions[i3 + 1] = 0;
                    positions[i3 + 2] = (Math.random() - 0.5) * length;
                }
                
                // X和Z方向的轻微漂移
                const drift = Math.sin(group.userData.time * 2 + i) * 0.1;
                positions[i3] += drift * deltaTime;
            }
            
            group.userData.particles.geometry.attributes.position.needsUpdate = true;
            
            // 闪烁效果
            group.userData.particles.material.opacity = 0.6 + Math.sin(group.userData.time * 5) * 0.3;
        }
        
        // 检测玩家是否在气流中
        function checkAirflowInteraction() {
            for (const airflow of airflows) {
                const airflowX = airflow.position.x;
                const airflowZ = airflow.position.z;
                const airflowLength = airflow.userData.length;
                const airflowHeight = airflow.userData.height;
                
                // 检查玩家是否在气流范围内
                const dx = Math.abs(playerSphere.position.x - airflowX);
                const dz = Math.abs(playerSphere.position.z - airflowZ);
                const dy = playerSphere.position.y;
                
                // X方向范围（气流宽度约1.2）
                // Z方向范围（气流长度）
                // Y方向范围（气流高度内）
                if (dx < 0.8 && dz < airflowLength / 2 && dy < airflowHeight && dy > 0) {
                    return {
                        inAirflow: true,
                        force: AIRFLOW_FORCE,
                        height: airflowHeight
                    };
                }
            }
            return { inAirflow: false };
        }
        
        // ========== 大型气流创建函数 ==========
        function createLargeAirflow(x, z) {
            const group = new THREE.Group();
            group.userData.type = 'large_airflow';
            group.userData.startZ = z;
            group.userData.length = LARGE_AIRFLOW_LENGTH;
            group.userData.height = LARGE_AIRFLOW_HEIGHT;
            
            // 设置气流组的世界位置
            group.position.set(x, 0, z);
            
            // 创建气流粒子（使用局部坐标）
            const particleCount = LARGE_AIRFLOW_PARTICLES;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];
            
            for (let i = 0; i < particleCount; i++) {
                // 粒子在气流区域内随机分布（使用局部坐标）
                positions[i * 3] = (Math.random() - 0.5) * 2.5; // X方向稍宽
                positions[i * 3 + 1] = Math.random() * LARGE_AIRFLOW_HEIGHT; // Y方向从0到气流高度
                positions[i * 3 + 2] = (Math.random() - 0.5) * LARGE_AIRFLOW_LENGTH; // Z方向在气流长度内
                
                // 粒子向上运动的速度
                velocities.push({
                    x: (Math.random() - 0.5) * 0.8,
                    y: 4 + Math.random() * 3, // 更快的向上速度
                    z: (Math.random() - 0.5) * 0.8
                });
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // 蓝色材质（更亮的蓝色）
            const material = new THREE.PointsMaterial({
                color: 0x00aaff,
                size: 0.5,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(geometry, material);
            particles.frustumCulled = false;
            group.add(particles);
            group.userData.particles = particles;
            group.userData.velocities = velocities;
            group.userData.time = 0;
            
            // 添加大的蓝色箭头标识
            const arrowGroup = new THREE.Group();
            const arrowCount = 5; // 多个箭头
            for (let i = 0; i < arrowCount; i++) {
                const arrowShape = new THREE.Shape();
                arrowShape.moveTo(0, 1.5);
                arrowShape.lineTo(0.8, 0);
                arrowShape.lineTo(0.3, 0);
                arrowShape.lineTo(0.3, -1);
                arrowShape.lineTo(-0.3, -1);
                arrowShape.lineTo(-0.3, 0);
                arrowShape.lineTo(-0.8, 0);
                arrowShape.closePath();
                
                const arrowGeometry = new THREE.ShapeGeometry(arrowShape);
                const arrowMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00aaff,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.9
                });
                const arrow = new THREE.Mesh(arrowGeometry, arrowMaterial);
                arrow.rotation.x = -Math.PI / 2;
                arrow.position.set(0, 0.1 + i * 3, -LARGE_AIRFLOW_LENGTH / 2 + 3 + i * 3);
                arrow.scale.set(2, 2, 2); // 大箭头
                arrowGroup.add(arrow);
            }
            group.add(arrowGroup);
            group.userData.arrows = arrowGroup;
            
            return group;
        }
        
        // 更新大型气流粒子特效
        function updateLargeAirflowParticles(group, deltaTime) {
            group.userData.time += deltaTime;
            
            const positions = group.userData.particles.geometry.attributes.position.array;
            const velocities = group.userData.velocities;
            const particleCount = positions.length / 3;
            const length = group.userData.length;
            const height = group.userData.height;
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                
                // 更新位置
                positions[i3] += velocities[i].x * deltaTime;
                positions[i3 + 1] += velocities[i].y * deltaTime;
                positions[i3 + 2] += velocities[i].z * deltaTime;
                
                // 如果粒子超出范围，重置到底部
                if (positions[i3 + 1] > height || positions[i3 + 1] < 0) {
                    positions[i3] = (Math.random() - 0.5) * 2.5;
                    positions[i3 + 1] = 0;
                    positions[i3 + 2] = (Math.random() - 0.5) * length;
                }
                
                // 轻微漂移
                const drift = Math.sin(group.userData.time * 2 + i) * 0.15;
                positions[i3] += drift * deltaTime;
            }
            
            group.userData.particles.geometry.attributes.position.needsUpdate = true;
            
            // 箭头动画
            if (group.userData.arrows) {
                for (let i = 0; i < group.userData.arrows.children.length; i++) {
                    const arrow = group.userData.arrows.children[i];
                    // 向上移动的动画
                    arrow.position.y = 0.1 + ((group.userData.time * 3 + i * 3) % LARGE_AIRFLOW_HEIGHT);
                    // 闪烁效果
                    arrow.material.opacity = 0.7 + Math.sin(group.userData.time * 5 + i) * 0.3;
                }
            }
            
            // 闪烁效果
            group.userData.particles.material.opacity = 0.7 + Math.sin(group.userData.time * 4) * 0.3;
        }
        
        // 检测玩家是否在大型气流中
        function checkLargeAirflowInteraction() {
            for (const airflow of largeAirflows) {

                const airflowZ = airflow.position.z;
                const airflowLength = airflow.userData.length;
                
                // 检查玩家是否在气流X和Z范围内
                const dx = Math.abs(playerSphere.position.x - airflowX);
                const dz = Math.abs(playerSphere.position.z - airflowZ);
                
                // 只要玩家在气流的X和Z范围内，就触发气流效果
                // 移除Y方向的限制，让玩家可以一直被推上去
                if (dx < 1.5 && dz < airflowLength / 2) {

                        inAirflow: true,
                        force: LARGE_AIRFLOW_FORCE,
                        targetHeight: AIRWAY_HEIGHT // 目标高度是气流跑道高度
                    };
                }
            }
            return { inAirflow: false };
        }

        // 创建浮空障碍物墙（多个小障碍物拼接）
        function createAirwayWall(z) {
            const wallGroup = new THREE.Group();
            wallGroup.userData.type = 'airway_wall';
            
            const blockWidth = AIRWAY_WALL_BLOCK_WIDTH;
            const blockHeight = AIRWAY_WALL_BLOCK_HEIGHT;
            const blockDepth = AIRWAY_WALL_DEPTH;
            
            const blocksX = Math.floor(AIRWAY_WALL_WIDTH / blockWidth); // 5列
            const blocksY = Math.floor(AIRWAY_WALL_HEIGHT / blockHeight); // 3行
            
            wallGroup.userData.blocks = [];
            
            for (let x = 0; x < blocksX; x++) {
                for (let y = 0; y < blocksY; y++) {
                    const blockGeometry = new THREE.BoxGeometry(blockWidth, blockHeight, blockDepth);
                    const block = new THREE.Mesh(blockGeometry, airwayWallMaterial);
                    
                    const posX = (x - blocksX / 2) * blockWidth + blockWidth / 2;
                    const posY = y * blockHeight + blockHeight / 2;
                    
                    block.position.set(posX, posY, 0);
                    block.userData.block = true;
                    block.userData.destroyed = false;
                    block.userData.position = new THREE.Vector3(posX, posY, 0);
                    
                    wallGroup.add(block);
                    wallGroup.userData.blocks.push(block);
                }
            }
            
            wallGroup.position.z = z;
            wallGroup.position.y = AIRWAY_HEIGHT + sphereRadius - AIRWAY_WALL_HEIGHT / 2;
            wallGroup.userData.size = new THREE.Vector3(AIRWAY_WALL_WIDTH, AIRWAY_WALL_HEIGHT, AIRWAY_WALL_DEPTH);
            wallGroup.userData.destroyed = false;
            
            scene.add(wallGroup);
            return wallGroup;
        }

                const airflowLength = airflow.userData.length;
                
                // 检查玩家是否在气流X和Z范围内
                const dx = Math.abs(playerSphere.position.x - airflowX);
                const dz = Math.abs(playerSphere.position.z - airflowZ);
                
                // 需要玩家在气流跑道高度范围内
                const dy = Math.abs(playerSphere.position.y - DOWNWARD_AIRFLOW_HEIGHT);
                
                if (dx < 1.2 && dz < airflowLength / 2 && dy < 2) {
                    return {
                        inAirflow: true,
                        force: DOWNWARD_AIRFLOW_FORCE,
                        trackIndex: airflow.userData.trackIndex
                    };
                }
            }
            return { inAirflow: false };

            const particleCount = GAME_CONFIG.particles.explosionCount;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);

            const color1 = new THREE.Color(0xff4400);
            const color2 = new THREE.Color(0xffff00);
            const color3 = new THREE.Color(0xff0000);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                positions[i3] = x;
                positions[i3 + 1] = y;
                positions[i3 + 2] = z;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const speed = GAME_CONFIG.particles.explosionSpeedMin + Math.random() * (GAME_CONFIG.particles.explosionSpeedMax - GAME_CONFIG.particles.explosionSpeedMin);

                velocities[i3] = speed * Math.sin(phi) * Math.cos(theta);
                velocities[i3 + 1] = speed * Math.cos(phi);
                velocities[i3 + 2] = speed * Math.sin(phi) * Math.sin(theta);

                const mix = Math.random();
                if (mix < 0.4) {
                    color1.toArray(colors, i3);
                } else if (mix < 0.7) {
                    color2.toArray(colors, i3);
                } else {
                    color3.toArray(colors, i3);
                }

                sizes[i] = 0.08 + Math.random() * 0.12;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 1.0
            });

            const explosion = new THREE.Points(geometry, material);
            explosion.frustumCulled = false;
            explosion.userData.velocities = velocities;
            explosion.userData.sizes = sizes;
            explosion.userData.life = 1.0;
            scene.add(explosion);

        // 加载音效（带超时机制）
        async function loadSounds() {
            const timeout = 3000; // 每个音效加载超时时间（毫秒）
            
            async function fetchWithTimeout(url, ms) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), ms);
                try {
                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    return response;
                } catch (error) {
                    clearTimeout(timeoutId);
                    throw error;
                }
            }
            
            for (const [name, url] of Object.entries(soundUrls)) {
                try {
                    const response = await fetchWithTimeout(url, timeout);
                    if (!response.ok) {
                        throw new Error(`加载失败: ${response.status}`);
                    }
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    sounds[name] = audioBuffer;
                    console.log(`音效 ${name} 加载成功`);
                } catch (error) {
                    console.warn(`音效 ${name} 加载失败:`, error.message);
                    sounds[name] = null;
                }
            }
        }

        // 播放音效（带失败检查）
        function playSound(name, volume = 0.5) {
            if (!sounds[name]) {
                return; // 音效未加载或加载失败，静默返回
            }
            
            try {
                const source = audioContext.createBufferSource();
                source.buffer = sounds[name];
                
                const gainNode = audioContext.createGain();
                gainNode.gain.value = volume;
                
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                source.start();
            } catch (error) {
                console.warn(`播放音效 ${name} 失败:`, error.message);
            }
        }

            gameState.isDescending = false;
            
            // 清空浮空障碍物墙
            for (const wall of airwayWalls) {
                scene.remove(wall);
                const blocks = wall.userData.blocks || [];
                for (const block of blocks) {
                    block.geometry.dispose();
                }
            }
            airwayWalls.length = 0;
            nextAirwayWallDistance = 0;
            
            // 清空金币障碍物
            for (const goldObs of goldObstacles) {
                scene.remove(goldObs);
                goldObs.traverse((child) => {
                    if (child instanceof THREE.Mesh) {
                        child.geometry.dispose();
                    }
                });
            }
            goldObstacles.length = 0;
            nextGoldObstacleDistance = 100;
            
            // 清空八面体障碍物
            for (const obs of octoberObstacles) {
                scene.remove(obs);
                obs.traverse((child) => {
                    if (child instanceof THREE.Mesh) {
                        child.geometry.dispose();
                    }
                });
            }
            octoberObstacles.length = 0;
            nextOctoberObstacleDistance = 80;
            
            // 清空普通球形障碍物
            for (const obs of sphereObstacles) {
                scene.remove(obs);
                obs.geometry.dispose();
            }
            sphereObstacles.length = 0;
            nextSphereObstacleDistance = 60;
            
            // 重新初始化气流
            const visibleAirflows = Math.ceil(150 / AIRFLOW_INTERVAL) + 2;
            for (let i = 0; i < visibleAirflows; i++) {
                const airflowZ = -i * AIRFLOW_INTERVAL;
                const airflowX = trackPositions[Math.floor(Math.random() * 3)];
                const airflow = createAirflow(airflowX, airflowZ);
                airflows.push(airflow);
                scene.add(airflow);
            }
            
            // 初始化气流跑道
            initAirways();
            gameState.onAirway = false;
            gameState.airwayTrack = 1;
            gameState.airwayTargetX = airwayTrackPositions[1];
            gameState.airwayCurrentX = airwayTrackPositions[1];

            // 重置金币位置
            for (let i = 0; i < coinGroups.length; i++) {
                // 先移除旧的金币组，重新创建新的
                scene.remove(coinGroups[i]);
            }
            coinGroups.length = 0;
            for (let i = 0; i < visibleCoins; i++) {
                const coinGroup = createCoinGroup();
                coinGroup.position.z = -i * coinInterval;
                coinGroups.push(coinGroup);
                scene.add(coinGroup);
            }

            // 重置加速补给位置
            for (let i = 0; i < boostGroups.length; i++) {
                scene.remove(boostGroups[i]);
            }
            boostGroups.length = 0;
            for (let i = 0; i < visibleBoosts; i++) {
                const boostGroup = createBoostGroup();
                boostGroup.position.z = -i * boostInterval;
                boostGroups.push(boostGroup);
                scene.add(boostGroup);
            }

            // 重置星空背景位置
            stars.position.z = 0;

            // 设置游戏状态：开始游戏但立即暂停
            gameState.isPlaying = true;
            gameState.isPaused = true;

            // 显示倒计时

            countdownNumber.textContent = '3';
