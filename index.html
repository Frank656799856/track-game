        // 障碍物交互检测结果
        // type: 'top' - 可以站在上面, 'wall' - 撞墙, 'none' - 无交互
        function checkObstacleInteraction(obstacle) {
            const obsWorldPos = new THREE.Vector3();
            obstacle.getWorldPosition(obsWorldPos);
            const obsSize = obstacle.userData.size || { x: GAME_CONFIG.groundObstacle.normalSize, y: GAME_CONFIG.groundObstacle.normalHeight, z: GAME_CONFIG.groundObstacle.normalSize };

            // XZ方向判定范围（放宽，避免穿透）
            const dx = Math.abs(playerSphere.position.x - obsWorldPos.x);
            const dz = Math.abs(playerSphere.position.z - obsWorldPos.z);
            const xRange = obsSize.x / 2 + sphereRadius * GAME_CONFIG.collision.sphereCollisionScale;
            const zRange = obsSize.z / 2 + sphereRadius * GAME_CONFIG.collision.sphereCollisionScale;

            // 不在水平范围内
            if (dx >= xRange || dz >= zRange) {
                return { type: 'none' };
            }

            // 在水平范围内，根据Y位置判断交互类型
            const sphereBottom = playerSphere.position.y - sphereRadius;
            const obsTop = obsSize.y;
            const tolerance = GAME_CONFIG.collision.tolerance;

            if (sphereBottom >= obsTop - tolerance) {
                // 球在障碍物上方（或接近顶部）→ 可以站在上面
                return { type: 'top', height: obsTop + sphereRadius };
            } else {
                // 球在障碍物侧面/前方 → 撞墙
                return { type: 'wall' };
            }
        }

        function triggerBounce(direction, magnitude = 0.3) {
            gameState.bounceDeform.active = true;
            gameState.bounceDeform.direction.copy(direction).normalize();
            gameState.bounceDeform.magnitude = magnitude;
            gameState.bounceDeform.time = 0;
        }

        function checkAim() {
            if (!gameState.onAirway) {
                if (gameState.aimedTarget) {
                    removeAimBorder(gameState.aimedTarget);
                    gameState.aimedTarget = null;
                }
                return;
            }

            const playerPos = playerSphere.position;
            const aimLine = new THREE.Vector3(0, 0, -1);
            
            let closestTarget = null;
            let closestDistance = Infinity;

            for (const wall of airwayWalls) {
                if (wall.userData.destroyed) continue;
                
                const blocks = wall.userData.blocks || [];
                for (const block of blocks) {
                    if (block.userData.destroyed) continue;
                    
                    const blockWorldPos = new THREE.Vector3();
                    block.getWorldPosition(blockWorldPos);
                    
                    const dx = Math.abs(blockWorldPos.x - playerPos.x);
                    const dz = blockWorldPos.z - playerPos.z;
                    
                    if (dz > 0 && dz < BULLET_RANGE) {
                        const tolerance = 1.5;
                        if (dx < tolerance) {
                            const distance = dz;
                            if (distance < closestDistance) {
                                closestDistance = distance;
                                closestTarget = block;
                            }
                        }
                    }
                }
            }

            for (const goldObs of goldObstacles) {
                if (goldObs.userData.health <= 0) continue;
                
                const goldPos = goldObs.position;
                const dx = Math.abs(goldPos.x - playerPos.x);
                const dz = goldPos.z - playerPos.z;
                
                if (dz > 0 && dz < BULLET_RANGE) {
                    const tolerance = 1;
                    if (dx < tolerance) {
                        const distance = dz;
                        if (distance < closestDistance) {
                            closestDistance = distance;
                            closestTarget = goldObs.children[0];
                        }
                    }
                }
            }

            for (const octoberObs of octoberObstacles) {
                if (octoberObs.userData.health <= 0) continue;
                
                const octoberPos = octoberObs.position;
                const dx = Math.abs(octoberPos.x - playerPos.x);
                const dz = octoberPos.z - playerPos.z;
                
                if (dz > 0 && dz < BULLET_RANGE) {
                    const tolerance = 1;
                    if (dx < tolerance) {
                        const distance = dz;
                        if (distance < closestDistance) {
                            closestDistance = distance;
                            closestTarget = octoberObs.children[0];
                        }
                    }
                }
            }

            for (const sphereObs of sphereObstacles) {
                const spherePos = sphereObs.position;
                const dx = Math.abs(spherePos.x - playerPos.x);
                const dz = spherePos.z - playerPos.z;
                
                if (dz > 0 && dz < BULLET_RANGE) {
                    const tolerance = 1;
                    if (dx < tolerance) {
                        const distance = dz;
                        if (distance < closestDistance) {
                            closestDistance = distance;
                            closestTarget = sphereObs;
                        }
                    }
                }
            }

            if (gameState.aimedTarget !== closestTarget) {
                if (gameState.aimedTarget) {
                    removeAimBorder(gameState.aimedTarget);
                }
                gameState.aimedTarget = closestTarget;
                if (closestTarget) {
                    addAimBorder(closestTarget);
                }
            }
        }

        function addAimBorder(object) {
            if (object.userData.aimBorder) return;
            
            const box = new THREE.Box3().setFromObject(object);
            const size = new THREE.Vector3();
            box.getSize(size);
            
            const edges = new THREE.EdgesGeometry(object.geometry);
            const borderMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00ff00,
                linewidth: 2
            });
            const border = new THREE.LineSegments(edges, borderMaterial);
            
            object.add(border);
            object.userData.aimBorder = border;
        }

        function removeAimBorder(object) {
            if (object.userData.aimBorder) {
                object.remove(object.userData.aimBorder);
                object.userData.aimBorder.geometry.dispose();
                object.userData.aimBorder.material.dispose();
                object.userData.aimBorder = null;
            }
        }

        function updateGame(currentTime) {
                // 如果没有在玩游戏或者暂停了，不更新游戏逻辑
                if (!gameState.isPlaying || gameState.isPaused) {
                    lastTime = currentTime; // 更新时间，避免恢复时出现大跳跃
                    return;
                }

                const deltaTime = (currentTime - lastTime) / 1000;
                lastTime = currentTime;

                checkAim();

            // 基础速度每秒增长（不超过最大基础速度）
            if (gameState.baseSpeed < gameState.maxBaseSpeed) {
                gameState.baseSpeed += gameState.speedGrowthRate * deltaTime;
                if (gameState.baseSpeed > gameState.maxBaseSpeed) {
                    gameState.baseSpeed = gameState.maxBaseSpeed;
                }
            }

            // 当前速度平滑恢复到基础速度
            if (gameState.currentSpeed < gameState.baseSpeed) {
                gameState.currentSpeed += gameState.speedRecoveryRate * deltaTime;
                if (gameState.currentSpeed > gameState.baseSpeed) {
                    gameState.currentSpeed = gameState.baseSpeed;
                }
            }

            // 计算实际移动速度（基础速度 + 加速 + 气流风环加速）
            const boostAdd = gameState.boostTime > 0 ? gameState.boostAmount : 0;
            const airwayBoostAdd = gameState.airwayBoostTime > 0 ? gameState.airwayBoostAmount : 0;
            const actualSpeed = gameState.currentSpeed + boostAdd + airwayBoostAdd;
            const moveDistance = actualSpeed * deltaTime;
            gameState.distance += moveDistance;
            
            // 更新无敌时间
            if (gameState.invulnerableTime > 0) {
                gameState.invulnerableTime -= deltaTime;
            }

            playerSphere.rotation.x += moveDistance / sphereRadius;

            // 平滑轨道切换（线性插值）
            const lerpSpeed = GAME_CONFIG.player.trackSwitchSpeed;
            const currentDistance = gameState.targetX - gameState.currentX;
            
            gameState.currentX += currentDistance * lerpSpeed * deltaTime;
            
            // 当接近目标时直接设置，避免微小抖动
            if (Math.abs(currentDistance) < 0.001) {
                gameState.currentX = gameState.targetX;
            }

            playerSphere.position.x = gameState.currentX;

            // ========== 气流检测 ==========
            const airflowInteraction = checkAirflowInteraction();
            const largeAirflowInteraction = checkLargeAirflowInteraction();
            const airwayInteraction = checkAirwayInteraction();

            // ========== 气流跑道处理 ==========
            // 如果玩家进入气流跑道高度范围，自动锁定
            if (airwayInteraction.onAirway && !gameState.onAirway) {
                gameState.onAirway = true;
                gameState.airwayTrack = airwayInteraction.trackIndex;
                gameState.airwayTargetX = airwayInteraction.x;
                gameState.airwayCurrentX = airwayInteraction.x;
                gameState.isJumping = false;
                gameState.velocityY = 0;
                // 初始化垂直位置和速度
                gameState.airwayY = AIRWAY_HEIGHT + sphereRadius;
                gameState.airwayVerticalVelocity = 0;
                trackDisplay.textContent = '气流跑道: ' + (gameState.airwayTrack + 1);
                
                // 隐藏跳跃按钮，显示气流控制按钮和射击按钮
                jumpButton.style.display = 'none';
                airwayControls.style.display = 'flex';
                shootButton.style.display = 'flex';
            }
            
            // 如果玩家离开气流跑道高度范围
            if (!airwayInteraction.onAirway && gameState.onAirway) {
                gameState.onAirway = false;
                trackDisplay.textContent = '当前轨道: ' + (gameState.currentTrack === 0 ? '左' : gameState.currentTrack === 1 ? '中' : '右');
                
                // 隐藏气流控制按钮和射击按钮，显示跳跃按钮
                airwayControls.style.display = 'none';
                shootButton.style.display = 'none';
                jumpButton.style.display = 'flex';
            }
            
            // 在气流跑道上时
            if (gameState.onAirway) {
                // 平滑切换跑道
                if (Math.abs(gameState.airwayTargetX - gameState.airwayCurrentX) > 0.01) {
                    gameState.airwayCurrentX += (gameState.airwayTargetX - gameState.airwayCurrentX) * AIRWAY_SWITCH_SPEED * deltaTime;
                } else {
                    gameState.airwayCurrentX = gameState.airwayTargetX;
                }
                playerSphere.position.x = gameState.airwayCurrentX;
                gameState.currentX = gameState.airwayCurrentX;
                
                // 气流跑道垂直移动逻辑（匀速运动）
                const AIRWAY_SPEED = GAME_CONFIG.player.airwayVerticalSpeed;
                
                if (gameState.keysPressed['arrowup']) {
                    gameState.airwayY += AIRWAY_SPEED * deltaTime;
                } else if (gameState.keysPressed['arrowdown']) {
                    gameState.airwayY -= AIRWAY_SPEED * deltaTime;
                }
                
                // 限制Y位置在气流跑道高度±2范围内
                const minY = AIRWAY_HEIGHT + sphereRadius - AIRWAY_Y_MARGIN;
                const maxY = AIRWAY_HEIGHT + sphereRadius + AIRWAY_Y_MARGIN;
                gameState.airwayY = Math.max(minY, Math.min(maxY, gameState.airwayY));
                
                // 应用Y位置到玩家
                playerSphere.position.y = gameState.airwayY;
                
                gameState.velocityY = 0;
                gameState.isJumping = false;
                
                // 检测向下气流碰撞
                const downwardAirflowInteraction = checkDownwardAirflowInteraction();
                if (downwardAirflowInteraction.inAirflow) {
                    // 触发下降
                    gameState.isDescending = true;
                    gameState.onAirway = false;
                    gameState.isJumping = true;
                    // 设置向下的初速度
                    gameState.velocityY = -DOWNWARD_AIRFLOW_FORCE * 0.5;
                    
                    // 将玩家X坐标对齐到对应的地面轨道
                    const targetGroundX = trackPositions[downwardAirflowInteraction.trackIndex];
                    gameState.currentX = targetGroundX;
                    playerSphere.position.x = targetGroundX;
                    
                    trackDisplay.textContent = '当前轨道: ' + (downwardAirflowInteraction.trackIndex === 0 ? '左' : downwardAirflowInteraction.trackIndex === 1 ? '中' : '右');
                    
                    // 隐藏气流控制按钮和射击按钮，显示跳跃按钮
                    airwayControls.style.display = 'none';
                    shootButton.style.display = 'none';
                    jumpButton.style.display = 'flex';
                }
            } else {
                // ========== 物理更新：应用重力和气流 ==========
                // 如果在气流中，即使在地面上也要应用向上的力
                // 优先检测大型气流
                if (largeAirflowInteraction && largeAirflowInteraction.inAirflow) {
                    // 大型气流：将玩家推到气流跑道高度
                    const targetY = AIRWAY_HEIGHT + sphereRadius;
                    
                    // 如果还没到达目标高度，继续向上推
                    if (playerSphere.position.y < targetY) {
                        gameState.velocityY += LARGE_AIRFLOW_FORCE * deltaTime;
                        // 增大最大上升速度，确保能到达18格高度
                        if (gameState.velocityY > 30) {
                            gameState.velocityY = 30;
                        }
                        playerSphere.position.y += gameState.velocityY * deltaTime;
                        
                        // 限制最大高度不超过目标
                        if (playerSphere.position.y > targetY) {
                            playerSphere.position.y = targetY;
                            gameState.velocityY = 0;
                        }
                    }
                    
                    gameState.isJumping = true;
                } else if (airflowInteraction && airflowInteraction.inAirflow) {
                    gameState.velocityY += AIRFLOW_FORCE * deltaTime;
                    // 限制最大上升速度
                    if (gameState.velocityY > 10) {
                        gameState.velocityY = 10;
                    }
                    // 在气流中时应用向上推力直到离开气流
                    playerSphere.position.y += gameState.velocityY * deltaTime;
                    // 如果气流将玩家推离地面，进入跳跃状态
                    if (playerSphere.position.y > groundY) {
                        gameState.isJumping = true;
                    }
                } else if (gameState.isJumping || gameState.velocityY !== 0 || playerSphere.position.y > groundY) {
                    // 不在气流中时，应用重力
                    gameState.velocityY -= gravity * deltaTime;
                    // 限制最大下落速度，超过后匀速下落
                    if (gameState.velocityY < -MAX_FALL_SPEED) {
                        gameState.velocityY = -MAX_FALL_SPEED;
                    }
                    playerSphere.position.y += gameState.velocityY * deltaTime;
                }
            }

            // ========== 障碍物交互检测 ==========
            let highestSurface = groundY;
            let onObstacle = false;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += moveDistance;

                // 同步移动气流
                if (obstacles[i].userData.type === 'tall' && i < airflows.length) {
                    // 气流跟随对应的大型障碍物
                }

                const interaction = checkObstacleInteraction(obstacles[i]);

                if (interaction.type === 'wall') {
                    // 撞墙 → 爆炸
                    const obsPos = obstacles[i].position;
                    createExplosion(obsPos.x, obsPos.y, obsPos.z);
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                    
                    // 速度损失（保留40%）
                    gameState.currentSpeed *= GAME_CONFIG.player.collisionSpeedPenalty;
                    
                    // 碰撞弹性效果
                    const collisionDirection = new THREE.Vector3(
                        playerSphere.position.x - obsPos.x,
                        playerSphere.position.y - obsPos.y,
                        playerSphere.position.z - obsPos.z
                    );
                    triggerBounce(collisionDirection, 0.4);
                    
                    // 播放爆炸音效（每次碰撞都播放）
                    playSound('explosion', 0.6);
                    
                    // 只有不在无敌时间内才减少生命值
                    if (gameState.invulnerableTime <= 0) {
                        // 减少生命值
                        gameState.health--;
                        
                        // 检查游戏是否结束
                        if (gameState.health <= 0) {
                            endGame();
                        }
                    }
                } else if (interaction.type === 'top') {
                    // 可以站在上面，记录最高表面
                    if (interaction.height > highestSurface) {
                        highestSurface = interaction.height;
                        onObstacle = true;
                    }
                }
                
                // 检测障碍物上的金币碰撞
                for (let j = obstacles[i].children.length - 1; j >= 0; j--) {
                    const child = obstacles[i].children[j];
                    if (child.userData && child.userData.type === 'obstacle_coin') {
                        // 获取金币的世界坐标
                        const coinWorldPos = new THREE.Vector3();
                        child.getWorldPosition(coinWorldPos);
                        
                        // 检测玩家与金币的距离
                        const dx = playerSphere.position.x - coinWorldPos.x;
                        const dy = playerSphere.position.y - coinWorldPos.y;
                        const dz = playerSphere.position.z - coinWorldPos.z;
                        const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
                        
                        // 如果玩家碰到金币
                        if (distance < sphereRadius + GAME_CONFIG.collision.coinCollisionRadius) {
                            createCoinParticle(coinWorldPos.x, coinWorldPos.y, coinWorldPos.z);
                            obstacles[i].remove(child);
                            child.geometry.dispose();
                            child.material.dispose();
                            gameState.score += GAME_CONFIG.game.tallObstacleCoinScore;
                            gameState.coinsCollected++;
                            playSound('pickupCoin', 0.7); // 播放收集金币音效
                        } else {
                            // 金币旋转动画 - 累积Y轴旋转
                            child.userData.rotationAngle += deltaTime * 3;
                            child.rotation.z = Math.PI / 2 + child.userData.rotationAngle;
                        }
                    }
                }
            }

            // ========== 大坑检测 ==========
            let isOnPit = false;
            for (let i = 0; i < trackSegments.length; i++) {
                const segment = trackSegments[i];
                const segmentZ = segment.position.z;

                if (playerSphere.position.z >= segmentZ - segmentLength / 2 &&
                    playerSphere.position.z <= segmentZ + segmentLength / 2) {

                    const currentTrackIndex = gameState.currentTrack;
                    const blocks = segment.userData.blocks;
                    const numBlocks = Math.floor(segmentLength / BLOCK_LENGTH);
                    const relativeZ = playerSphere.position.z - segmentZ;
                    const blockIndex = Math.floor((relativeZ + segmentLength / 2) / BLOCK_LENGTH);

                    // 检查区块是否存在（如果区块被删除，就是大坑）
                    const blockExists = blocks.some(block =>
                        block.userData.trackIndex === currentTrackIndex &&
                        block.userData.blockIndex === blockIndex
                    );

                    if (!blockExists) {
                        isOnPit = true;
                    }
                }
            }

            // ========== 落地检测 ==========
            if (!isOnPit && playerSphere.position.y <= highestSurface) {
                // 不在大坑上，正常落地
                if (gameState.isJumping || gameState.velocityY < 0) {
                    triggerBounce(new THREE.Vector3(0, -1, 0), 0.2);
                }
                playerSphere.position.y = highestSurface;
                gameState.velocityY = 0;
                gameState.isJumping = false;
                // 落地后重置下降标志位
                gameState.isDescending = false;
            } else if (isOnPit && playerSphere.position.y <= groundY) {
                // 在大坑上，继续掉落
                gameState.isJumping = true;
            }

            // 更新状态
            gameState.onObstacle = onObstacle;
            gameState.onObstacleHeight = onObstacle ? highestSurface : 0;

            // ========== 积分系统 ==========
            // 每走一定距离获得1积分
            gameState.distanceForScore += moveDistance;
            if (gameState.distanceForScore >= GAME_CONFIG.game.scorePerDistance) {
                gameState.score += Math.floor(gameState.distanceForScore / GAME_CONFIG.game.scorePerDistance);
                gameState.distanceForScore %= GAME_CONFIG.game.scorePerDistance;
            }

            // ========== 加速系统 ==========
            // 更新加速时间
            if (gameState.boostTime > 0) {
                gameState.boostTime -= deltaTime;
                if (gameState.boostTime < 0) {
                    gameState.boostTime = 0;
                }
            }
            // 更新气流风环加速时间
            if (gameState.airwayBoostTime > 0) {
                gameState.airwayBoostTime -= deltaTime;
                if (gameState.airwayBoostTime < 0) {
                    gameState.airwayBoostTime = 0;
                }
            }

            // ========== 金币碰撞检测 ==========
            for (let i = coinGroups.length - 1; i >= 0; i--) {
                const coinGroup = coinGroups[i];
                const groupZ = coinGroup.position.z;

                // 检查金币组是否在玩家附近
                if (Math.abs(groupZ) < 3) {
                    // 检查每个金币
                    for (let j = coinGroup.children.length - 1; j >= 0; j--) {
                        const coin = coinGroup.children[j];

                        // 计算金币的世界坐标
                        const worldX = coinGroup.position.x + coin.position.x;
                        const worldZ = groupZ + coin.position.z;
                        const worldY = coin.position.y;

                        // 碰撞检测（考虑Y轴高度）
                        const dx = playerSphere.position.x - worldX;
                        const dy = playerSphere.position.y - worldY;
                        const dz = playerSphere.position.z - worldZ;
                        const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                        if (distance < sphereRadius + GAME_CONFIG.collision.coinCollisionRadius) {
                            // 收集金币 - 创建粒子特效
                            createCoinParticle(worldX, worldY, worldZ);

                            // 移除金币并释放资源
                            coinGroup.remove(coin);
                            coin.geometry.dispose();
                            coin.material.dispose();
                            gameState.score += GAME_CONFIG.game.scorePerCoin;
                            gameState.coinsCollected++; // 增加金币计数
                            playSound('pickupCoin', 0.7); // 播放收集金币音效
                        }
                    }

                    // 如果金币组为空，移除整个组
                    if (coinGroup.children.length === 0) {
                        scene.remove(coinGroup);
                        coinGroups.splice(i, 1);
                    }
                }
            }

            // ========== 加速补给碰撞检测 ==========
            for (let i = boostGroups.length - 1; i >= 0; i--) {
                const boostGroup = boostGroups[i];
                const groupZ = boostGroup.position.z;

                // 检查加速补给是否在玩家附近
                if (Math.abs(groupZ) < 2) {
                    // 如果玩家在气流跑道上，跳过加速补给碰撞检测
                    if (gameState.onAirway) {
                        continue;
                    }
                    
                    // 获取加速补给的世界坐标
                    const worldX = boostGroup.position.x + boostGroup.children[0].position.x;
                    const worldZ = groupZ + boostGroup.children[0].position.z;

                    // 碰撞检测
                    const dx = playerSphere.position.x - worldX;
                    const dz = playerSphere.position.z - worldZ;
                    const distance = Math.sqrt(dx * dx + dz * dz);

                    if (distance < sphereRadius + GAME_CONFIG.collision.boostCollisionRadius) {
                        // 收集加速补给
                        scene.remove(boostGroup);
                        boostGroups.splice(i, 1);
                        gameState.boostTime = gameState.boostDuration;
                        playSound('pickupBoost', 0.5); // 播放加速补给拾取音效
                    }
                }
            }

            // ========== 气流跑道加速风环碰撞检测 ==========
            for (let i = windRingGroups.length - 1; i >= 0; i--) {
                const windRing = windRingGroups[i];
                const groupZ = windRing.position.z;

                if (Math.abs(groupZ) < 2) {
                    // 如果玩家不在气流跑道上，跳过风环碰撞检测
                    if (!gameState.onAirway) {
                        continue;
                    }

                    const worldX = windRing.position.x;
                    const worldZ = groupZ;
                    const worldY = windRing.position.y;

                    const dx = playerSphere.position.x - worldX;
                    const dy = playerSphere.position.y - worldY;
                    const dz = playerSphere.position.z - worldZ;
                    const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
                    const ringRadius = windRing.userData.ringRadius || GAME_CONFIG.airway.width / 2;

                    if (distance < ringRadius) {
                        // 碰到风环，获得加速
                        scene.remove(windRing);
                        windRingGroups.splice(i, 1);
                        gameState.airwayBoostTime = gameState.airwayBoostDuration;
                    }
                }
            }

            // ========== 轨道移动 ==========
            for (let i = 0; i < trackSegments.length; i++) {
                trackSegments[i].position.z += moveDistance;
            }

            const recycleThreshold = segmentLength;
            if (trackSegments.length > 0 && trackSegments[0].position.z > recycleThreshold) {
                const frontSegment = trackSegments.shift();
                const lastSegment = trackSegments[trackSegments.length - 1];
                frontSegment.position.z = lastSegment.position.z - segmentLength;
                trackSegments.push(frontSegment);

                // 更新全局编号并决定是否生成大坑
                globalSegmentCounter++;
                frontSegment.userData.globalIndex = globalSegmentCounter;

                // 清除旧的警示标识
                const warnings = frontSegment.children.filter(child => child.userData.type === 'warning');
                warnings.forEach(warning => {
                    frontSegment.remove(warning);
                });

                // 重新生成区块（如果之前有大坑）
                if (!frontSegment.userData.blocks || frontSegment.userData.blocks.length === 0) {
                    // 重新创建区块
                    const numBlocks = Math.floor(segmentLength / BLOCK_LENGTH);
                    const blockMaterial = new THREE.MeshStandardMaterial({
                        color: 0x2a2a2a,
                        metalness: 0.3,
                        roughness: 0.8
                    });

                    frontSegment.userData.blocks = [];

                    for (let t = 0; t < 3; t++) {
                        for (let b = 0; b < numBlocks; b++) {
                            const block = new THREE.Mesh(
                                new THREE.BoxGeometry(trackWidth, 0.1, BLOCK_LENGTH),
                                blockMaterial
                            );
                            const blockX = (t - 1) * (trackWidth + trackGap);
                            const blockZ = -segmentLength / 2 + b * BLOCK_LENGTH + BLOCK_LENGTH / 2;
                            block.position.set(blockX, 0.05, blockZ);
                            block.userData.trackIndex = t;
                            block.userData.blockIndex = b;
                            block.userData.startZ = blockZ;
                            frontSegment.add(block);
                            frontSegment.userData.blocks.push(block);
                        }
                    }
                }

                // 重置大坑标记（重新生成的轨道段）
                frontSegment.userData.hasPit = false;

                // 大坑系统已关闭
                // 每12段轨道生成一个大坑
                // if (globalSegmentCounter % 12 === 0 && !frontSegment.userData.hasPit) {
                //     generatePit(frontSegment);
                //     frontSegment.userData.hasPit = true;
                // }
            }

            // ========== 柱子移动 ==========
            for (let i = 0; i < pillarGroups.length; i++) {
                pillarGroups[i].position.z += moveDistance;
            }

            const firstPillarZ = pillarGroups[0].position.z;
            if (firstPillarZ > pillarInterval) {
                const lastPillar = pillarGroups[pillarGroups.length - 1];
                const newZ = lastPillar.position.z - pillarInterval;

                pillarGroups[0].position.z = newZ;

                const removed = pillarGroups.shift();
                pillarGroups.push(removed);

                const newIndex = Math.round(newZ / pillarInterval);
                removed.userData.index = newIndex;

                const cyanLight = removed.children[2];
                const magentaLight = removed.children[3];
                if (newIndex % 2 === 0) {
                    cyanLight.material.color.setHex(0x00ffff);
                    magentaLight.material.color.setHex(0xff00ff);
                } else {
                    cyanLight.material.color.setHex(0xff00ff);
                    magentaLight.material.color.setHex(0x00ffff);
                }
            }

            if (obstacles.length > 0) {
                const firstObstacleZ = obstacles[0].position.z;
                if (firstObstacleZ > obstacleInterval) {
                    const lastObstacle = obstacles[obstacles.length - 1];
                    const newZ = lastObstacle.position.z - obstacleInterval;

                    // 随机决定障碍物类型
                    const isTall = Math.random() < 0.3; // 30%概率生成大型障碍物
                    
                    // 移除旧障碍物
                    const oldObstacle = obstacles[0];
                    scene.remove(oldObstacle);
                    obstacles.shift();
                    
                    // 创建新障碍物
                    const obstacle = isTall ? createTallObstacle() : createObstacle();
                    obstacle.position.z = newZ;
                    obstacle.position.x = trackPositions[Math.floor(Math.random() * 3)];
                    obstacles.push(obstacle);
                    scene.add(obstacle);
                }
            }
            
            // ========== 气流独立刷新 ==========
            // 检查是否需要刷新气流（基于间隔）
            const shouldRefreshAirflow = airflows.length === 0 || 
                (airflows.length > 0 && airflows[airflows.length - 1].position.z > -100);
            
            // 如果没有气流，初始化气流
            if (airflows.length === 0) {
                // 为每个紫色障碍物生成气流（使用动态偏移量）
                for (const obstacle of obstacles) {
                    if (obstacle.userData.type === 'tall') {
                        const airflowX = obstacle.position.x;
                        const dynamicOffset = getDynamicAirflowOffset();
                        const airflowZ = obstacle.position.z + BLOCK_LENGTH / 2 + dynamicOffset;
                        const airflow = createAirflow(airflowX, airflowZ);
                        airflows.push(airflow);
                        scene.add(airflow);
                    }
                }
            }
            
            // 移动所有气流
            for (let i = airflows.length - 1; i >= 0; i--) {
                const airflow = airflows[i];
                airflow.position.z += moveDistance;
                
                // 更新气流粒子特效
                updateAirflowParticles(airflow, deltaTime);
                
                // 移除超出范围的气流
                if (airflow.position.z > 20) {
                    scene.remove(airflow);
                    airflow.userData.particles.geometry.dispose();
                    airflow.userData.particles.material.dispose();
                    airflows.splice(i, 1);
                }
            }
            
            // 如果气流数量少于紫色障碍物，生成新气流
            const tallObstacleCount = obstacles.filter(o => o.userData.type === 'tall').length;
            if (airflows.length < tallObstacleCount) {
                const newAirflow = generateAirflowNearTallObstacle();
                if (newAirflow) {
                    airflows.push(newAirflow);
                    scene.add(newAirflow);
                }
            }
            
            // ========== 大型气流刷新 ==========
            // 更新大型气流计数器
            largeAirflowCounter += Math.abs(moveDistance);
            
            // 如果没有大型气流，初始化
            if (largeAirflows.length === 0 && largeAirflowCounter >= LARGE_AIRFLOW_INTERVAL * segmentLength - 150) {
                // 在随机轨道生成大型气流
                const airflowX = trackPositions[Math.floor(Math.random() * 3)];
                const airflowZ = -150;
                const largeAirflow = createLargeAirflow(airflowX, airflowZ);
                largeAirflows.push(largeAirflow);
                scene.add(largeAirflow);
                largeAirflowCounter = 0;
            }
            
            // 移动所有大型气流
            for (let i = largeAirflows.length - 1; i >= 0; i--) {
                const airflow = largeAirflows[i];
                airflow.position.z += moveDistance;
                
                // 更新大型气流粒子特效
                updateLargeAirflowParticles(airflow, deltaTime);
                
                // 移除超出范围的大型气流
                if (airflow.position.z > 30) {
                    scene.remove(airflow);
                    airflow.userData.particles.geometry.dispose();
                    airflow.userData.particles.material.dispose();
                    if (airflow.userData.arrows) {
                        for (const arrow of airflow.userData.arrows.children) {
                            arrow.geometry.dispose();
                            arrow.material.dispose();
                        }
                    }
                    largeAirflows.splice(i, 1);
                }
            }
            
            // 如果最末大型气流已移出视野，生成新大型气流
            if (largeAirflows.length > 0) {
                const lastAirflow = largeAirflows[largeAirflows.length - 1];
                if (lastAirflow.position.z > -100) {
                    const airflowX = trackPositions[Math.floor(Math.random() * 3)];
                    const airflowZ = lastAirflow.position.z - LARGE_AIRFLOW_INTERVAL * segmentLength;
                    const newAirflow = createLargeAirflow(airflowX, airflowZ);
                    largeAirflows.push(newAirflow);
                    scene.add(newAirflow);
                }
            }
            
            // ========== 子弹系统更新 ==========
            // 更新射击冷却时间
            if (gameState.shootCooldown > 0) {
                gameState.shootCooldown -= deltaTime;
            }
            
            // 更新子弹位置和碰撞检测
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                
                // 子弹向前移动（-Z方向）
                bullet.position.z -= BULLET_SPEED * deltaTime;
                
                // 检测子弹与障碍物的碰撞
                let hit = false;
                for (const obsGroup of obstacles) {
                    const obsWorldPos = obsGroup.position;
                    const obsSize = obsGroup.userData.size || new THREE.Vector3(1, 1, 1);
                    
                    const dx = Math.abs(bullet.position.x - obsWorldPos.x);
                    const dz = Math.abs(bullet.position.z - obsWorldPos.z);
                    const dy = Math.abs(bullet.position.y - obsWorldPos.y);
                    
                    const xRange = obsSize.x / 2 + BULLET_RADIUS;
                    const zRange = obsSize.z / 2 + BULLET_RADIUS;
                    const yRange = obsSize.y / 2 + BULLET_RADIUS;
                    
                    if (dx < xRange && dz < zRange && dy < yRange) {
                        hit = true;
                        // 创建爆炸效果
                        createExplosion(obsWorldPos.x, obsWorldPos.y + obsSize.y / 2, obsWorldPos.z);
                        // 播放爆炸音效
                        playSound('explosion', 0.3);
                        // 移除障碍物
                        scene.remove(obsGroup);
                        obstacles.splice(obstacles.indexOf(obsGroup), 1);
                        // 增加分数
                        gameState.score += GAME_CONFIG.game.obstacleDestroyScore;
                        break;
                    }
                }
                
                // 检测子弹与浮空障碍物墙的碰撞（每个小障碍物单独判定）
                if (!hit) {
                    for (const wall of airwayWalls) {
                        if (wall.userData.destroyed) continue;
                        
                        const blocks = wall.userData.blocks || [];
                        for (let k = blocks.length - 1; k >= 0; k--) {
                            const block = blocks[k];
                            if (block.userData.destroyed) continue;
                            
                            const blockWorldPos = new THREE.Vector3();
                            block.getWorldPosition(blockWorldPos);
                            
                            const blockSize = block.geometry.parameters;
                            
                            const dx = Math.abs(bullet.position.x - blockWorldPos.x);
                            const dz = Math.abs(bullet.position.z - blockWorldPos.z);
                            const dy = Math.abs(bullet.position.y - blockWorldPos.y);
                            
                            const xRange = blockSize.width / 2 + BULLET_RADIUS;
                            const zRange = blockSize.depth / 2 + BULLET_RADIUS;
                            const yRange = blockSize.height / 2 + BULLET_RADIUS;
                            
                            if (dx < xRange && dz < zRange && dy < yRange) {
                            hit = true;
                            block.userData.destroyed = true;
                            // 创建爆炸效果
                            createExplosion(blockWorldPos.x, blockWorldPos.y, blockWorldPos.z);
                            // 播放爆炸音效
                            playSound('explosion', 0.3);
                            // 移除小障碍物（从父级group移除）
                            if (block.parent) {
                                block.parent.remove(block);
                            }
                            block.geometry.dispose();
                            blocks.splice(k, 1);
                            // 增加金币
                            gameState.coinsCollected += GAME_CONFIG.airwayWall.coinReward;
                            break;
                        }
                        }
                        if (hit) break;
                    }
                }
                
                // 检测子弹与金币障碍物的碰撞
                if (!hit) {
                    for (let j = goldObstacles.length - 1; j >= 0; j--) {
                        const goldObs = goldObstacles[j];
                        if (goldObs.userData.destroyed) continue;
                        
                        const goldPos = goldObs.position;
                        const goldSize = goldObs.userData.size;
                        
                        const dx = Math.abs(bullet.position.x - goldPos.x);
                        const dz = Math.abs(bullet.position.z - goldPos.z);
                        const dy = Math.abs(bullet.position.y - (goldPos.y + goldSize.y / 2));
                        
                        const xRange = goldSize.x / 2 + BULLET_RADIUS;
                        const zRange = goldSize.z / 2 + BULLET_RADIUS;
                        const yRange = goldSize.y / 2 + BULLET_RADIUS;
                        
                        if (dx < xRange && dz < zRange && dy < yRange) {
                            hit = true;
                            goldObs.userData.health--;
                            // 创建爆炸效果
                            createExplosion(bullet.position.x, bullet.position.y, bullet.position.z);
                            // 播放爆炸音效
                            playSound('explosion', 0.3);
                            // 更新血条显示
                            updateGoldObstacleHealthBar(goldObs);
                            
                            if (goldObs.userData.health <= 0) {
                                // 障碍物被摧毁
                                goldObs.userData.destroyed = true;
                                createExplosion(goldPos.x, goldPos.y + goldSize.y / 2, goldPos.z);
                                // 播放爆金币音效
                                playSound('pickupCoin', 0.8);
                                // 创建飞行金币动画
                                createFlyingCoins(goldPos.x, goldPos.y + goldSize.y / 2, goldPos.z, GAME_CONFIG.goldObstacle.flyingCoinCount);
                                // 随机奖励积分（子弹击毁）
                                const reward = Math.floor(Math.random() * (GAME_CONFIG.goldObstacle.bulletRewardMax - GAME_CONFIG.goldObstacle.bulletRewardMin + 1)) + GAME_CONFIG.goldObstacle.bulletRewardMin;
                                gameState.score += reward;
                                // 移除障碍物
                                scene.remove(goldObs);
                                // 清理所有网格资源（包括血条）
                                goldObs.traverse((child) => {
                                    if (child instanceof THREE.Mesh) {
                                        child.geometry.dispose();
                                    }
                                });
                                goldObstacles.splice(j, 1);
                            }
                            break;
                        }
                    }
                    
                    // 子弹与八面体障碍物碰撞检测
                    for (let j = octoberObstacles.length - 1; j >= 0; j--) {
                        const octoberObs = octoberObstacles[j];
                        if (octoberObs.userData.destroyed) continue;
                        
                        const octoberPos = octoberObs.position;
                        const octoberSize = octoberObs.userData.size;
                        
                        const dx = Math.abs(bullet.position.x - octoberPos.x);
                        const dz = Math.abs(bullet.position.z - octoberPos.z);
                        const dy = Math.abs(bullet.position.y - (octoberPos.y + octoberSize.y / 2));
                        
                        const xRange = octoberSize.x / 2 + BULLET_RADIUS;
                        const zRange = octoberSize.z / 2 + BULLET_RADIUS;
                        const yRange = octoberSize.y / 2 + BULLET_RADIUS;
                        
                        if (dx < xRange && dz < zRange && dy < yRange) {
                            hit = true;
                            octoberObs.userData.health--;
                            createExplosion(bullet.position.x, bullet.position.y, bullet.position.z);
                            playSound('explosion', 0.3);
                            updateOctoberObstacleHealthBar(octoberObs);
                            
                            if (octoberObs.userData.health <= 0) {
                                // 障碍物被摧毁
                                octoberObs.userData.destroyed = true;
                                createExplosion(octoberPos.x, octoberPos.y + octoberSize.y / 2, octoberPos.z);
                                playSound('explosion', 0.8);
                                gameState.score += octoberObs.userData.points;
                                scene.remove(octoberObs);
                                octoberObs.traverse((child) => {
                                    if (child instanceof THREE.Mesh) {
                                        child.geometry.dispose();
                                    }
                                });
                                octoberObstacles.splice(j, 1);
                            }
                            break;
                        }
                    }
                    
                    // 子弹与普通球形障碍物碰撞检测
                    for (let j = sphereObstacles.length - 1; j >= 0; j--) {
                        const sphereObs = sphereObstacles[j];
                        if (sphereObs.userData.destroyed) continue;
                        
                        const spherePos = sphereObs.position;
                        const sphereSize = sphereObs.userData.size;
                        
                        const dx = Math.abs(bullet.position.x - spherePos.x);
                        const dz = Math.abs(bullet.position.z - spherePos.z);
                        const dy = Math.abs(bullet.position.y - spherePos.y);
                        
                        const xRange = sphereSize.x / 2 + BULLET_RADIUS;
                        const zRange = sphereSize.z / 2 + BULLET_RADIUS;
                        const yRange = sphereSize.y / 2 + BULLET_RADIUS;
                        
                        if (dx < xRange && dz < zRange && dy < yRange) {
                            hit = true;
                            // 障碍物被摧毁（血量1，一击即碎）
                            sphereObs.userData.destroyed = true;
                            createExplosion(bullet.position.x, bullet.position.y, bullet.position.z);
                            playSound('explosion', 0.3);
                            createExplosion(spherePos.x, spherePos.y, spherePos.z);
                            playSound('explosion', 0.8);
                            gameState.score += sphereObs.userData.points;
                            scene.remove(sphereObs);
                            sphereObs.geometry.dispose();
                            sphereObstacles.splice(j, 1);
                            break;
                        }
                    }
                }
                
                // 如果子弹超出屏幕范围、击中障碍物或超出射击范围，移除子弹
                const bulletDistance = Math.abs(bullet.userData.startZ - bullet.position.z);
                if (hit || bullet.position.z < -200 || bulletDistance > BULLET_RANGE) {
                    scene.remove(bullet);
                    bullets.splice(i, 1);
                }
            }
            
            // ========== 更新气流跑道 ==========
            updateAirways(deltaTime, moveDistance);
            
            // ========== 向下气流生成与更新 ==========
            // 检查是否需要生成新的向下气流（基于distance间隔600-1000格）
            const dist = Math.floor(gameState.distance);
            
            if (dist >= nextDownwardAirflowDistance) {
                // 在随机一条气流跑道上生成向下气流
                const trackIndex = Math.floor(Math.random() * AIRWAY_COUNT);
                const airflowX = airwayTrackPositions[trackIndex];
                const airflowZ = -200; // 在远处生成
                
                const downwardAirflow = createDownwardAirflow(airflowX, airflowZ, trackIndex);
                downwardAirflows.push(downwardAirflow);
                scene.add(downwardAirflow);
                
                // 预计算下一次生成的距离
                const randomInterval = DOWNWARD_AIRFLOW_MIN_INTERVAL + 
                    Math.random() * (DOWNWARD_AIRFLOW_MAX_INTERVAL - DOWNWARD_AIRFLOW_MIN_INTERVAL);
                nextDownwardAirflowDistance = dist + randomInterval;
            }
            
            // 移动所有向下气流
            for (let i = downwardAirflows.length - 1; i >= 0; i--) {
                const airflow = downwardAirflows[i];
                airflow.position.z += moveDistance;
                
                // 更新向下气流粒子特效
                updateDownwardAirflowParticles(airflow, deltaTime);
                
                // 移除超出范围的向下气流
                if (airflow.position.z > 30) {
                    scene.remove(airflow);
                    airflow.userData.particles.geometry.dispose();
                    airflow.userData.particles.material.dispose();
                    if (airflow.userData.arrows) {
                        for (const arrow of airflow.userData.arrows.children) {
                            arrow.geometry.dispose();
                            arrow.material.dispose();
                        }
                    }
                    downwardAirflows.splice(i, 1);
                }
            }
            
            // ========== 浮空障碍物墙生成与移动 ==========
            // 只在气流跑道上时生成浮空障碍物墙
            if (gameState.onAirway) {
                if (dist >= nextAirwayWallDistance) {
                    // 生成浮空障碍物墙
                    const airwayWall = createAirwayWall(-200);
                    airwayWalls.push(airwayWall);
                    
                    // 预计算下一次生成的距离
                    nextAirwayWallDistance = dist + AIRWAY_WALL_INTERVAL;
                }
                
                // 移动所有浮空障碍物墙
                for (let i = airwayWalls.length - 1; i >= 0; i--) {
                    const wall = airwayWalls[i];
                    wall.position.z += moveDistance;
                    
                    // 移除超出范围或已完全摧毁的浮空障碍物墙
                    const blocks = wall.userData.blocks || [];
                    const hasUndestroyedBlocks = blocks.some(b => !b.userData.destroyed);
                    
                    if (wall.position.z > 30 || !hasUndestroyedBlocks) {
                        scene.remove(wall);
                        for (const block of blocks) {
                            block.geometry.dispose();
                        }
                        airwayWalls.splice(i, 1);
                    }
                }
                
                // 检测玩家与浮空障碍物墙的碰撞（每个小障碍物单独判定）
                for (const wall of airwayWalls) {
                    const blocks = wall.userData.blocks || [];
                    for (const block of blocks) {
                        if (block.userData.destroyed) continue;
                        
                        const blockWorldPos = new THREE.Vector3();
                        block.getWorldPosition(blockWorldPos);
                        
                        const blockSize = block.geometry.parameters;
                        
                        const dx = Math.abs(playerSphere.position.x - blockWorldPos.x);
                        const dz = Math.abs(playerSphere.position.z - blockWorldPos.z);
                        const dy = Math.abs(playerSphere.position.y - blockWorldPos.y);
                        
                        const xRange = blockSize.width / 2 + sphereRadius;
                        const zRange = blockSize.depth / 2 + sphereRadius;
                        const yRange = blockSize.height / 2 + sphereRadius;
                        
                        if (dx < xRange && dz < zRange && dy < yRange) {
                            // 玩家撞墙受伤，进入0.5秒无敌时间
                            if (gameState.invulnerableTime <= 0) {
                                gameState.health--;
                                gameState.invulnerableTime = AIRWAY_WALL_INVULNERABLE_TIME;
                                playSound('explosion', 0.5);
                                
                                if (gameState.health <= 0) {
                                    endGame();
                                }
                            }
                            break;
                        }
                    }
                }
            // ========== 金币障碍物生成与移动 ==========
                // 生成金币障碍物
                if (dist >= nextGoldObstacleDistance) {
                    const goldObs = createGoldObstacle(-200);
                    goldObstacles.push(goldObs);
                    
                    const randomInterval = GOLD_OBSTACLE_INTERVAL_MIN + 
                        Math.random() * (GOLD_OBSTACLE_INTERVAL_MAX - GOLD_OBSTACLE_INTERVAL_MIN);
                    nextGoldObstacleDistance = dist + randomInterval;
                }
                
                // 移动所有金币障碍物
                for (let i = goldObstacles.length - 1; i >= 0; i--) {
                    const goldObs = goldObstacles[i];
                    goldObs.position.z += moveDistance;
                    
                    // 移除超出范围的金币障碍物
                    if (goldObs.position.z > 30 || goldObs.userData.destroyed) {
                        if (!goldObs.userData.destroyed) {
                            scene.remove(goldObs);
                            goldObs.traverse((child) => {
                                if (child instanceof THREE.Mesh) {
                                    child.geometry.dispose();
                                }
                            });
                        }
                        goldObstacles.splice(i, 1);
                    }
                }
                
                // 检测玩家与金币障碍物的碰撞
                for (const goldObs of goldObstacles) {
                    if (goldObs.userData.destroyed) continue;
                    
                    const goldPos = goldObs.position;
                    const goldSize = goldObs.userData.size;
                    
                    const dx = Math.abs(playerSphere.position.x - goldPos.x);
                    const dz = Math.abs(playerSphere.position.z - goldPos.z);
                    const dy = Math.abs(playerSphere.position.y - (goldPos.y + goldSize.y / 2));
                    
                    const xRange = goldSize.x / 2 + sphereRadius;
                    const zRange = goldSize.z / 2 + sphereRadius;
                    const yRange = goldSize.y / 2 + sphereRadius;
                    
                    if (dx < xRange && dz < zRange && dy < yRange) {
                        // 玩家碰撞受伤，进入无敌时间
                        if (gameState.invulnerableTime <= 0) {
                            gameState.health--;
                            gameState.invulnerableTime = AIRWAY_WALL_INVULNERABLE_TIME;
                            playSound('explosion', 0.5);
                            
                            if (gameState.health <= 0) {
                                endGame();
                            }
                        }
                        // 速度损失60%（保留40%）
                        gameState.currentSpeed *= 0.6;
                        
                        // 玩家碰撞也减少障碍物血量
                        goldObs.userData.health--;
                        createExplosion(playerSphere.position.x, playerSphere.position.y, playerSphere.position.z);
                        playSound('explosion', 0.3);
                        updateGoldObstacleHealthBar(goldObs);
                        
                        if (goldObs.userData.health <= 0) {
                            // 障碍物被玩家碰撞摧毁
                            goldObs.userData.destroyed = true;
                            createExplosion(goldPos.x, goldPos.y + goldSize.y / 2, goldPos.z);
                            playSound('pickupCoin', 0.8);
                            // 创建飞行金币动画
                            createFlyingCoins(goldPos.x, goldPos.y + goldSize.y / 2, goldPos.z, GAME_CONFIG.goldObstacle.flyingCoinCount);
                            // 随机奖励积分（玩家碰撞击毁，获得部分积分）
                            const reward = Math.floor(Math.random() * (GAME_CONFIG.goldObstacle.playerRewardMax - GAME_CONFIG.goldObstacle.playerRewardMin + 1)) + GAME_CONFIG.goldObstacle.playerRewardMin;
                            gameState.score += reward;
                            scene.remove(goldObs);
                            goldObs.traverse((child) => {
                                if (child instanceof THREE.Mesh) {
                                    child.geometry.dispose();
                                }
                            });
                        }
                        break;
                    }
                }
                
                // ========== 八面体障碍物生成与移动 ==========
                // 生成八面体障碍物
                if (dist >= nextOctoberObstacleDistance) {
                    const octoberObs = createOctoberObstacle(-200);
                    octoberObstacles.push(octoberObs);
                    
                    const randomInterval = OCTOBER_OBSTACLE_INTERVAL_MIN + 
                        Math.random() * (OCTOBER_OBSTACLE_INTERVAL_MAX - OCTOBER_OBSTACLE_INTERVAL_MIN);
                    nextOctoberObstacleDistance = dist + randomInterval;
                }
                
                // 移动并更新所有八面体障碍物（含上下浮动）
                for (let i = octoberObstacles.length - 1; i >= 0; i--) {
                    const octoberObs = octoberObstacles[i];
                    octoberObs.position.z += moveDistance;
                    
                    // 更新上下浮动
                    const time = Date.now() * 0.001;
                    const floatY = Math.sin(time * OCTOBER_OBSTACLE_FLOAT_SPEED + octoberObs.userData.floatOffset) * OCTOBER_OBSTACLE_FLOAT_RANGE;
                    octoberObs.position.y = octoberObs.userData.baseY + floatY;
                    
                    // 移除超出范围的八面体障碍物
                    if (octoberObs.position.z > 30 || octoberObs.userData.destroyed) {
                        if (!octoberObs.userData.destroyed) {
                            scene.remove(octoberObs);
                            octoberObs.traverse((child) => {
                                if (child instanceof THREE.Mesh) {
                                    child.geometry.dispose();
                                }
                            });
                        }
                        octoberObstacles.splice(i, 1);
                    }
                }
                
                // 检测玩家与八面体障碍物的碰撞
                for (const octoberObs of octoberObstacles) {
                    if (octoberObs.userData.destroyed) continue;
                    
                    const octoberPos = octoberObs.position;
                    const octoberSize = octoberObs.userData.size;
                    
                    const dx = Math.abs(playerSphere.position.x - octoberPos.x);
                    const dz = Math.abs(playerSphere.position.z - octoberPos.z);
                    const dy = Math.abs(playerSphere.position.y - (octoberPos.y + octoberSize.y / 2));
                    
                    const xRange = octoberSize.x / 2 + sphereRadius;
                    const zRange = octoberSize.z / 2 + sphereRadius;
                    const yRange = octoberSize.y / 2 + sphereRadius;
                    
                    if (dx < xRange && dz < zRange && dy < yRange) {
                        // 玩家碰撞受伤，进入无敌时间
                        if (gameState.invulnerableTime <= 0) {
                            gameState.health--;
                            gameState.invulnerableTime = AIRWAY_WALL_INVULNERABLE_TIME;
                            createExplosion(playerSphere.position.x, playerSphere.position.y, playerSphere.position.z);
                            playSound('explosion', 0.5);
                            // 速度衰减
                            gameState.currentSpeed *= 0.4;
                        }
                        
                        // 障碍物减少血量
                        octoberObs.userData.health--;
                        updateOctoberObstacleHealthBar(octoberObs);
                        
                        if (octoberObs.userData.health <= 0) {
                            // 障碍物被玩家碰撞摧毁
                            octoberObs.userData.destroyed = true;
                            createExplosion(octoberPos.x, octoberPos.y + octoberSize.y / 2, octoberPos.z);
                            playSound('explosion', 0.8);
                            gameState.score += octoberObs.userData.points;
                            scene.remove(octoberObs);
                            octoberObs.traverse((child) => {
                                if (child instanceof THREE.Mesh) {
                                    child.geometry.dispose();
                                }
                            });
                        }
                        break;
                    }
                }
                
                // ========== 普通球形障碍物生成与移动 ==========
                // 生成球形障碍物
                if (dist >= nextSphereObstacleDistance) {
                    const sphereObs = createSphereObstacle(-200);
                    sphereObstacles.push(sphereObs);
                    
                    const randomInterval = SPHERE_OBSTACLE_INTERVAL_MIN + 
                        Math.random() * (SPHERE_OBSTACLE_INTERVAL_MAX - SPHERE_OBSTACLE_INTERVAL_MIN);
                    nextSphereObstacleDistance = dist + randomInterval;
                }
                
                // 移动所有球形障碍物
                for (let i = sphereObstacles.length - 1; i >= 0; i--) {
                    const sphereObs = sphereObstacles[i];
                    sphereObs.position.z += moveDistance;
                    
                    // 移除超出范围的球形障碍物
                    if (sphereObs.position.z > 30 || sphereObs.userData.destroyed) {
                        if (!sphereObs.userData.destroyed) {
                            scene.remove(sphereObs);
                            sphereObs.geometry.dispose();
                        }
                        sphereObstacles.splice(i, 1);
                    }
                }
                
                // 检测玩家与球形障碍物的碰撞
                for (const sphereObs of sphereObstacles) {
                    if (sphereObs.userData.destroyed) continue;
                    
                    const spherePos = sphereObs.position;
                    const sphereSize = sphereObs.userData.size;
                    
                    const dx = Math.abs(playerSphere.position.x - spherePos.x);
                    const dz = Math.abs(playerSphere.position.z - spherePos.z);
                    const dy = Math.abs(playerSphere.position.y - spherePos.y);
                    
                    const xRange = sphereSize.x / 2 + sphereRadius;
                    const zRange = sphereSize.z / 2 + sphereRadius;
                    const yRange = sphereSize.y / 2 + sphereRadius;
                    
                    if (dx < xRange && dz < zRange && dy < yRange) {
                        // 玩家碰撞受伤，进入无敌时间
                        if (gameState.invulnerableTime <= 0) {
                            gameState.health--;
                            gameState.invulnerableTime = AIRWAY_WALL_INVULNERABLE_TIME;
                            createExplosion(playerSphere.position.x, playerSphere.position.y, playerSphere.position.z);
                            playSound('explosion', 0.5);
                            gameState.currentSpeed *= 0.4;
                        }
                        
                        // 障碍物被摧毁
                        sphereObs.userData.destroyed = true;
                        createExplosion(spherePos.x, spherePos.y, spherePos.z);
                        playSound('explosion', 0.8);
                        gameState.score += sphereObs.userData.points;
                        scene.remove(sphereObs);
                        sphereObs.geometry.dispose();
                        break;
                    }
                }
            } else {
                // 玩家离开气流跑道时，清空所有浮空障碍物墙
                for (const wall of airwayWalls) {
                    scene.remove(wall);
                    const blocks = wall.userData.blocks || [];
                    for (const block of blocks) {
                        block.geometry.dispose();
                    }
                }
                airwayWalls.length = 0;
                nextAirwayWallDistance = 0;
                
                // 清空所有金币障碍物
                for (const goldObs of goldObstacles) {
                    scene.remove(goldObs);
                    goldObs.traverse((child) => {
                        if (child instanceof THREE.Mesh) {
                            child.geometry.dispose();
                        }
                    });
                }
                goldObstacles.length = 0;
                nextGoldObstacleDistance = 100;
                
                // 清空所有八面体障碍物
                for (const octoberObs of octoberObstacles) {
                    scene.remove(octoberObs);
                    octoberObs.traverse((child) => {
                        if (child instanceof THREE.Mesh) {
                            child.geometry.dispose();
                        }
                    });
                }
                octoberObstacles.length = 0;
                nextOctoberObstacleDistance = 80;
                
                // 清空所有普通球形障碍物
                for (const sphereObs of sphereObstacles) {
                    scene.remove(sphereObs);
                    sphereObs.geometry.dispose();
                }
                sphereObstacles.length = 0;
                nextSphereObstacleDistance = 60;
            }

            while (obstacles.length < visibleObstacles) {
                const lastObstacle = obstacles.length > 0 ? obstacles[obstacles.length - 1] : null;
                const newZ = lastObstacle ? lastObstacle.position.z - obstacleInterval : -obstacleInterval;

                // 随机决定障碍物类型
                const isTall = Math.random() < 0.3; // 30%概率生成大型障碍物
                const obstacle = isTall ? createTallObstacle() : createObstacle();
                obstacle.position.z = newZ;
                obstacle.position.x = trackPositions[Math.floor(Math.random() * 3)];
                obstacles.push(obstacle);
                scene.add(obstacle);
            }

            // ========== 金币移动 ==========
            for (let i = 0; i < coinGroups.length; i++) {
                coinGroups[i].position.z += moveDistance;

                // 金币旋转动画
                for (let j = 0; j < coinGroups[i].children.length; j++) {
                    coinGroups[i].children[j].rotation.y += deltaTime * GAME_CONFIG.coin.rotationSpeed;
                }
            }

            const firstCoinZ = coinGroups[0].position.z;
            if (firstCoinZ > coinInterval) {
                const lastCoin = coinGroups[coinGroups.length - 1];
                const newZ = lastCoin.position.z - coinInterval;

                // 移除旧金币组
                scene.remove(coinGroups[0]);
                coinGroups.shift();

                // 创建新金币组
                const newCoinGroup = createCoinGroup();
                newCoinGroup.position.z = newZ;
                coinGroups.push(newCoinGroup);
                scene.add(newCoinGroup);
            }

            while (coinGroups.length < visibleCoins) {
                const lastCoin = coinGroups.length > 0 ? coinGroups[coinGroups.length - 1] : null;
                const newZ = lastCoin ? lastCoin.position.z - coinInterval : -coinInterval;

                const newCoinGroup = createCoinGroup();
                newCoinGroup.position.z = newZ;
                coinGroups.push(newCoinGroup);
                scene.add(newCoinGroup);
            }

            // ========== 加速补给移动 ==========
            for (let i = 0; i < boostGroups.length; i++) {
                boostGroups[i].position.z += moveDistance;

                // 加速补给旋转动画
                for (let j = 0; j < boostGroups[i].children.length; j++) {
                    boostGroups[i].children[j].rotation.y += deltaTime * 2;
                }
            }

            const firstBoostZ = boostGroups[0].position.z;
            if (firstBoostZ > boostInterval) {
                const lastBoost = boostGroups[boostGroups.length - 1];
                const newZ = lastBoost.position.z - boostInterval;

                // 移除旧加速补给
                scene.remove(boostGroups[0]);
                boostGroups.shift();

                // 创建新加速补给
                const newBoostGroup = createBoostGroup();
                newBoostGroup.position.z = newZ;
                boostGroups.push(newBoostGroup);
                scene.add(newBoostGroup);
            }

            // ========== 气流跑道加速风环移动 ==========
            for (let i = 0; i < windRingGroups.length; i++) {
                windRingGroups[i].position.z += moveDistance;

                // 粒子旋转动画（绕风环中心旋转，带高度变化）
                const particles = windRingGroups[i].userData.particles;
                if (particles) {
                    const positions = particles.geometry.attributes.position.array;
                    const velocities = windRingGroups[i].userData.particleVelocities;
                    for (let j = 0; j < velocities.length; j++) {
                        velocities[j].angle += velocities[j].speed;
                        positions[j * 3] = Math.cos(velocities[j].angle) * velocities[j].radius;
                        positions[j * 3 + 1] += velocities[j].heightSpeed;
                        if (Math.abs(positions[j * 3 + 1]) > velocities[j].radius * 0.5) {
                            velocities[j].heightSpeed *= -1;
                        }
                        positions[j * 3 + 2] = Math.sin(velocities[j].angle) * velocities[j].radius;
                    }
                    particles.geometry.attributes.position.needsUpdate = true;
                }
            }

            const firstWindRingZ = windRingGroups[0] ? windRingGroups[0].position.z : 0;
            if (firstWindRingZ > windRingInterval) {
                const lastWindRing = windRingGroups[windRingGroups.length - 1];
                const newZ = lastWindRing.position.z - windRingInterval;

                scene.remove(windRingGroups[0]);
                windRingGroups.shift();

                const newWindRing = createWindRing();
                newWindRing.position.z = newZ;
                newWindRing.position.y = windRingHeight;
                windRingGroups.push(newWindRing);
                scene.add(newWindRing);
            }

            while (windRingGroups.length < visibleWindRings) {
                const lastWindRing = windRingGroups.length > 0 ? windRingGroups[windRingGroups.length - 1] : null;
                const newZ = lastWindRing ? lastWindRing.position.z - windRingInterval : -windRingInterval;

                const newWindRing = createWindRing();
                newWindRing.position.z = newZ;
                newWindRing.position.y = windRingHeight;
                windRingGroups.push(newWindRing);
                scene.add(newWindRing);
            }

            while (boostGroups.length < visibleBoosts) {
                const lastBoost = boostGroups.length > 0 ? boostGroups[boostGroups.length - 1] : null;
                const newZ = lastBoost ? lastBoost.position.z - boostInterval : -boostInterval;

                const newBoostGroup = createBoostGroup();
                newBoostGroup.position.z = newZ;
                boostGroups.push(newBoostGroup);
                scene.add(newBoostGroup);
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                const explosion = explosions[i];
                explosion.userData.life -= deltaTime * GAME_CONFIG.particles.explosionDecay;

                if (explosion.userData.life <= 0) {
                    scene.remove(explosion);
                    explosion.geometry.dispose();
                    explosion.material.dispose();
                    explosions.splice(i, 1);
                    continue;
                }

                explosion.material.opacity = explosion.userData.life;

                const positions = explosion.geometry.attributes.position.array;
                const velocities = explosion.userData.velocities;

                for (let j = 0; j < positions.length / 3; j++) {
                    const j3 = j * 3;
                    positions[j3] += velocities[j3] * deltaTime;
                    positions[j3 + 1] += velocities[j3 + 1] * deltaTime;
                    positions[j3 + 2] += velocities[j3 + 2] * deltaTime;
                    velocities[j3 + 1] -= gravity * deltaTime * 0.5;
                }

                explosion.geometry.attributes.position.needsUpdate = true;
            }

            // 更新金币碰撞粒子特效
            for (let i = coinParticles.length - 1; i >= 0; i--) {
                const particle = coinParticles[i];
                particle.userData.life -= deltaTime * GAME_CONFIG.particles.coinParticleDecay;

                if (particle.userData.life <= 0) {
                    scene.remove(particle);
                    particle.geometry.dispose();
                    particle.material.dispose();
                    coinParticles.splice(i, 1);
                    continue;
                }

                particle.material.opacity = particle.userData.life;

                const positions = particle.geometry.attributes.position.array;
                const velocities = particle.userData.velocities;

                for (let j = 0; j < positions.length / 3; j++) {
                    const j3 = j * 3;
                    positions[j3] += velocities[j3] * deltaTime;
                    positions[j3 + 1] += velocities[j3 + 1] * deltaTime;
                    positions[j3 + 2] += velocities[j3 + 2] * deltaTime;
                    velocities[j3 + 1] -= gravity * deltaTime * 0.3;
                }

                particle.geometry.attributes.position.needsUpdate = true;
            }

            // 更新金币发光粒子（未碰撞时）
            updateCoinGlow();

            // 移除过期的发光粒子
            for (let i = coinGlowParticles.length - 1; i >= 0; i--) {
                const particle = coinGlowParticles[i];
                particle.userData.life -= deltaTime * GAME_CONFIG.particles.coinGlowDecay;

                if (particle.userData.life <= 0) {
                    scene.remove(particle);
                    particle.geometry.dispose();
                    particle.material.dispose();
                    coinGlowParticles.splice(i, 1);
                    continue;
                }

                particle.material.opacity = particle.userData.life;
            }

            stars.position.z += moveDistance * 0.3;
            if (stars.position.z > 50) {
                stars.position.z = -50;
            }

            playerLight.position.x = gameState.currentX;
            playerLight.position.z = playerSphere.position.z - 2;
            playerLight.position.y = playerSphere.position.y + 1;

            // 更新弹性效果
            if (gameState.bounceDeform.active) {
                gameState.bounceDeform.time += deltaTime;
                const progress = gameState.bounceDeform.time / gameState.bounceDeform.duration;
                
                if (progress >= 1) {
                    gameState.bounceDeform.active = false;
                    playerSphere.scale.set(1, 1, 1);
                } else {
                    const deform = Math.sin(progress * Math.PI) * gameState.bounceDeform.magnitude;
                    const dir = gameState.bounceDeform.direction;
                    
                    const sx = 1 + deform * (1 - Math.abs(dir.x) * 0.5);
                    const sy = 1 + deform * (1 - Math.abs(dir.y) * 0.5);
                    const sz = 1 + deform * (1 - Math.abs(dir.z) * 0.5);
                    
                    playerSphere.scale.set(sx, sy, sz);
                }
            }

            camera.position.x = gameState.currentX;
            // 摄像机跟随玩家高度
            camera.position.y = playerSphere.position.y + 3 + Math.sin(currentTime * 0.002) * 0.1;
            camera.lookAt(gameState.currentX, playerSphere.position.y + 0.5, -15);

            // 显示加速状态
            let speedText = `速度: ${gameState.currentSpeed.toFixed(1)}格/秒 (基础: ${gameState.baseSpeed.toFixed(1)})`;
            if (gameState.boostTime > 0) {
                speedText += ` [加速: ${gameState.boostTime.toFixed(1)}秒]`;
            }
            if (gameState.airwayBoostTime > 0) {
                speedText += ` [风环加速: ${gameState.airwayBoostTime.toFixed(1)}秒]`;
            }
            document.getElementById('speed-display').textContent = speedText;
            document.getElementById('distance-display').textContent = `距离: ${Math.floor(gameState.distance)}米`;
            document.getElementById('score-display').textContent = `积分: ${gameState.score}`;
            
            // 更新生命值显示（确保生命值不为负数）
            const displayHealth = Math.max(0, gameState.health);
            const hearts = '❤️'.repeat(displayHealth) + '🖤'.repeat(Math.max(0, gameState.maxHealth - displayHealth));
            let healthText = `生命: ${hearts}`;
            if (gameState.invulnerableTime > 0) {
                healthText += ` [无敌: ${gameState.invulnerableTime.toFixed(1)}秒]`;
            }
            document.getElementById('health-display').textContent = healthText;
        }

        function animate(currentTime) {
            requestAnimationFrame(animate);

            updateGame(currentTime);

            renderer.render(scene, camera);
        }

        // 初始化游戏
        async function initGame() {
            hideGameUI();
            // 音效加载和进度条动画并行执行，不阻塞
            loadSounds().catch(console.error);
            // 立即开始进度条动画
            simulateLoading();
            // 启动游戏循环
            requestAnimationFrame(animate);
        }

        // 启动游戏
        initGame();
    </script>
</body>
</html>
